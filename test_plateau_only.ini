#############################################
# Ridder Unified Potential: Plateau-Only Test
# Purpose: Verify plateau can drive inflation
# Expected: Slow-roll, n_s ~ 0.96, r < 0.1
#############################################

# Minimal cosmology (inflation dominated)
H0 = 67.36
omega_b = 0.0
omega_cdm = 0.0
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.0

# Ridder field: Unified potential, PLATEAU ONLY
use_ridder = yes
ridder_model_type = unified

# Global field scale
ridder_f = 1.0  # Will need to tune for inflation

# Tail: OFF
ridder_use_tail = no

# Shelf: OFF
ridder_use_shelf = no

# Plateau: ON (inflation)
ridder_use_plateau = yes
ridder_Lambda_inf_eV = 1.0e-3     # Will tune to match inflation energy scale
ridder_theta0_inf = 5.0           # Field scale where plateau rises
ridder_theta_inf_on = 8.0         # Where plateau window turns on
ridder_sigma_inf = 1.0            # Plateau smoothing
ridder_n_inf = 1.0

# Initial conditions (large theta for plateau)
theta_i_ridder = 10.0  # Start on plateau

# No CDM coupling
beta_ridder = 0.0

# Output settings
gauge = newtonian
output = background
write background = yes
write thermodynamics = no

root = output/test_plateau_only_

