#############################################
# Ridder Unified Potential: "Baby" Configuration
# Weakened parameters to stabilize perturbations
# Then walk back to full hero/safe strength
#############################################

# Standard cosmological parameters
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field: Unified potential (WEAKENED)
use_ridder = yes
ridder_model_type = unified

# Trigger for has_ridder flag (v2 compatibility)
Lambda_EDE_ridder = 0.3  # MUCH WEAKER than hero/safe (1.5)
f_axion_ridder = 2.435e27
theta_i_ridder = 1.0

# Global field scale
ridder_f = 2.435e27

# Tail: DISABLED for baby config
ridder_use_tail = no
ridder_Lambda_tail_eV = 2.3e-3
ridder_n_tail = 3.0

# Shelf: EDE bump (WEAKENED)
ridder_use_shelf = yes
ridder_Lambda_EDE_eV = 0.3  # << 1.5 eV (hero/safe)
ridder_n_EDE = 3.0

ridder_theta_EDE_low = 0.5
ridder_theta_EDE_high = 2.0
ridder_sigma_theta_EDE = 0.2

# Plateau: OFF
ridder_use_plateau = no
ridder_Lambda_inf_eV = 1.0e-3
ridder_theta0_inf = 5.0
ridder_theta_inf_on = 8.0
ridder_sigma_inf = 1.0
ridder_n_inf = 1.0

# CDM coupling: WEAKENED
beta_ridder = 0.05  # << 0.15-0.20 (hero/safe)
beta_z_c = 3000.0
beta_sigma_z = 0.5

# Dynamics control
ridder_c_slow = 1.0
ridder_freeze_phi = no
ridder_force_damping = 1.0
ridder_perturbation_mode = 0

# Output settings - TRY FULL CMB
gauge = newtonian
output = tCl,pCl,lCl,mPk
lensing = yes

# Relaxed perturbation demands while debugging
l_max_scalars = 2000  # < 2500 (less aggressive)
P_k_max_h/Mpc = 10.0
z_pk = 0

# Slightly looser tolerances if needed
# tol_perturb_integration = 1e-3  # Uncomment if still failing

write background = yes
background_verbose = 2
write parameters = yes

root = output/unified_baby_safe_

