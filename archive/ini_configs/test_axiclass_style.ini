# Test: AxiCLASS-style m²f² potential
# Based on AxiCLASS example_axiCLASS_fld.ini

# Standard cosmology
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

gauge = newtonian

# Unified Ridder field with AxiCLASS parameterization
use_ridder = yes
ridder_model_type = unified
ridder_f = 2.435e24  # f = f_axion * M_Pl (for theta = phi/f)

# Tail (late-time DE) - OFF for now
ridder_use_tail = no

# Shelf (EDE) - AxiCLASS style!
ridder_use_shelf = yes
ridder_m_axion = 1.0e3     # in H0 units - REDUCED for EDE scale  
ridder_f_axion = 0.001     # in M_Pl units - VERY SMALL for EDE
ridder_n_EDE = 3.0
ridder_theta_EDE_low = 0.1
ridder_theta_EDE_high = 5.0
ridder_sigma_theta_EDE = 0.2

# Plateau (inflation) - OFF
ridder_use_plateau = no

# Initial conditions
# theta_i = 2.8 like AxiCLASS EDE example
theta_i_ridder = 2.8

# NO CDM coupling for first test
beta_ridder = 0.0

# Evolution controls
ridder_c_slow = 1.0
ridder_force_damping = 1.0
ridder_freeze_phi = no

# Outputs (background only for quick test)
output = 
write background = yes
background_verbose = 2
write parameters = yes
root = output/test_axiclass_style_

# Precision
tol_background_integration = 1e-6

