# Test: AxiCLASS-style m²f² shooting for EDE
# Target: f_EDE = 0.13 at z_c ~ 3000

# Standard cosmology
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

gauge = newtonian

# Unified Ridder field with SHOOTING
use_ridder = yes
ridder_model_type = unified

# Component toggles
ridder_use_tail = no
ridder_use_shelf = yes
ridder_use_plateau = no

# Shelf parameters (m_axion will be calibrated by shooting)
ridder_f_axion = 0.01      # in M_Pl units (FIXED)
ridder_n_EDE = 3.0
ridder_theta_EDE_low = 0.1
ridder_theta_EDE_high = 5.0
ridder_sigma_theta_EDE = 0.2

# Initial conditions
ridder_f = 2.435e25        # f_axion * M_Pl for theta = phi/f
theta_i_ridder = 2.8       # Like AxiCLASS EDE

# NO CDM coupling for calibration
beta_ridder = 0.0

# SHOOTING ENABLED!
ridder_use_shooting_EDE = yes
ridder_f_EDE_target = 0.13           # Target EDE fraction
ridder_z_c_target = 3000             # Target redshift for peak
ridder_shooting_m_min = 1.0e2        # Min m_axion bracket (H0 units)
ridder_shooting_m_max = 1.0e6        # Max m_axion bracket (H0 units)
ridder_shooting_tolerance = 1.0e-3   # Tolerance on f_EDE
ridder_shooting_max_iterations = 30  # Max bisection steps

# Evolution controls
ridder_c_slow = 1.0
ridder_force_damping = 1.0
ridder_freeze_phi = no

# Outputs
output = 
write background = yes
background_verbose = 2
write parameters = yes
root = output/test_shooting_EDE_

# Precision
tol_background_integration = 1e-6

