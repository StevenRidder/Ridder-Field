#############################################
# Ridder Unified Potential: Safe Configuration
# BACKGROUND ONLY (no perturbations/CMB)
#############################################

# Standard cosmological parameters
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field: Unified potential
use_ridder = yes
ridder_model_type = unified

# Trigger for has_ridder flag (v2 compatibility)
Lambda_EDE_ridder = 1.5
f_axion_ridder = 2.435e27
theta_i_ridder = 1.0

# Global field scale
ridder_f = 2.435e27

# Tail: Late dark energy
ridder_use_tail = yes
ridder_Lambda_tail_eV = 2.3e-3
ridder_n_tail = 3.0

# Shelf: EDE bump
ridder_use_shelf = yes
ridder_Lambda_EDE_eV = 1.5
ridder_n_EDE = 3.0

ridder_theta_EDE_low = 0.5
ridder_theta_EDE_high = 2.0
ridder_sigma_theta_EDE = 0.2

# Plateau: OFF
ridder_use_plateau = no
ridder_Lambda_inf_eV = 1.0e-3
ridder_theta0_inf = 5.0
ridder_theta_inf_on = 8.0
ridder_sigma_inf = 1.0
ridder_n_inf = 1.0

# CDM coupling: Safe configuration
beta_ridder = 0.15
beta_z_c = 3000.0
beta_sigma_z = 0.5

# Dynamics control
ridder_c_slow = 1.0
ridder_freeze_phi = no
ridder_force_damping = 1.0
ridder_perturbation_mode = 0

# Output settings - BACKGROUND ONLY!
gauge = newtonian
output =  # Empty = background only, no perturbations!

write background = yes
background_verbose = 2
write parameters = yes

root = output/unified_cdm_safe_bgonly_

