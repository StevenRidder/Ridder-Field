#############################################
# Ridder Unified Potential: Tail-Only Test
# Purpose: Verify tail acts as late-time dark energy
# Expected: Ω_Λ ~ 0.7, w₀ ~ -1.0
#############################################

# Standard cosmological parameters
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field: Unified potential, TAIL ONLY
use_ridder = yes
ridder_model_type = unified

# Global field scale
ridder_f = 2.435e27  # M_Pl in eV

# Tail: ON (late dark energy)
ridder_use_tail = yes
ridder_Lambda_tail_eV = 2.3e-3  # Tune this to match Omega_Lambda
ridder_n_tail = 3.0

# Shelf: OFF
ridder_use_shelf = no

# Plateau: OFF
ridder_use_plateau = no

# No CDM coupling for pure tail test
beta_ridder = 0.0

# Output settings
gauge = newtonian
output = tCl,mPk
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0

write background = yes
write thermodynamics = no

root = output/test_tail_only_

