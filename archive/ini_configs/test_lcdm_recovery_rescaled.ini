# Phase 1.1A: ΛCDM Recovery (Rescaled Lambda)
# Goal: Match Omega_Lambda ~ 0.69 via frozen Ridder field
# 
# Calculation:
#   Previous: Lambda = 9e-4 eV → f_ridder ~ 7e-11
#   Target: f_ridder ~ 0.69
#   Scaling: (0.69 / 7e-11)^(1/4) ≈ 316
#   New Lambda ≈ 9e-4 × 316 ≈ 0.28 eV

# Standard cosmological parameters (Planck 2018 baseline)
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454
gauge = newtonian

# Ridder field configured as effective Lambda (RESCALED)
Lambda_EDE_ridder = 0.28
f_axion_ridder = 2.435e27
theta_i_ridder = 1.5
beta_ridder = 0.0
n_ridder = 3
ridder_c_slow = 0.0

# FREEZE MODE: Field acts as pure cosmological constant
ridder_freeze_phi = yes
ridder_force_damping = 0.0

# No shooting - testing fixed Lambda
use_ridder_shooting = 0

# Output settings (minimal for speed)
output = 
write background = no

