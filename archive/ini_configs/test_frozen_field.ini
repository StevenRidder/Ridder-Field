# Test A: Frozen Field Mode
# Purpose: Verify background integration works when Ridder field is frozen
# Expected: Fast run to z=0, rho_ridder constant, no stiffness

H0 = 70.0
omega_b = 0.0224
omega_cdm = 0.120
A_s = 2.1e-9
n_s = 0.965
tau_reio = 0.054
YHe = 0.245
gauge = newtonian

# Ridder field
Lambda_EDE_ridder = 1e10        # Test Lambda (will stay constant)
f_axion_ridder = 2.435e27       # M_Pl scale
theta_i_ridder = 1.5
beta_ridder = 0.0
n_ridder = 3

# FROZEN MODE: Field acts as cosmological constant
ridder_freeze_phi = 1           # 1 = TRUE: freeze phi and phi'
ridder_force_damping = 0.0      # 0.0 = no force (redundant with freeze, but explicit)
ridder_c_slow = 0.0             # Start with phi' = 0

# NO shooting for this test
use_ridder_shooting = 0

# Minimal output
output = 
write background = no
background_verbose = 0

