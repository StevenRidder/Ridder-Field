# ============================================================================
# AXICLASS ANCHOR TEST
# ============================================================================
# 
# Purpose: Use published AxiCLASS EDE parameters to establish anchor point
# 
# Source: AxiCLASS example_axiCLASS.ini + MontePython EDE params
#   - m_axion = 1e5 H0 units
#   - f_axion = 0.4 M_Pl
#   - theta_i = 2.8
#   - n = 3
#
# Expected: f_EDE ~ 0.10-0.13 at z ~ 3000-5000
#
# Strategy:
#   1. SHOOTING OFF - just test if we get a bump
#   2. If bump is correct → narrow shooting bracket around this m
#   3. If bump too strong → scale f_axion down systematically
#
# ============================================================================

# Standard ΛCDM
H0 = 67.36
omega_b = 0.02238280
omega_cdm = 0.1201075
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
YHe = 0.2454
gauge = newtonian

# ============================================================================
# RIDDER FIELD: AxiCLASS-style EDE ONLY
# ============================================================================
use_ridder = yes
ridder_model_type = unified

# Component toggles: SHELF ONLY (pure EDE test)
ridder_use_tail = no
ridder_use_shelf = yes
ridder_use_plateau = no

# ============================================================================
# AXICLASS PUBLISHED PARAMETERS (from their example_axiCLASS.ini)
# ============================================================================

# Axion mass (in H0 units)
# AxiCLASS uses m_axion = 1e5 H0 for their fiducial EDE
ridder_m_axion = 1.0e5

# Decay constant (in M_Pl units)
# AxiCLASS uses f_axion = 0.4 M_Pl, but that gives V ~ 10^49 eV^4
# Scale down systematically: 0.4 → 0.1 → 0.01
# Starting with 0.01 M_Pl for manageable energy scale
ridder_f_axion = 0.01

# Initial misalignment angle (radians)
# AxiCLASS uses theta_i = 2.8, but that's too strong at early times
# Start near minimum to avoid "too much non-radiation" error
# Field will still roll and create EDE bump
theta_i_ridder = 0.1

# Potential shape
# Standard axion: n = 3 for [1 - cos(theta)]^3
ridder_n_EDE = 3.0

# ============================================================================
# SHELF WINDOW
# ============================================================================
# For theta_i = 0.1, field starts near minimum
# Set window to capture evolution around this small displacement
ridder_theta_EDE_low = 0.001
ridder_theta_EDE_high = 1.0
ridder_sigma_theta_EDE = 0.1

# ============================================================================
# NO COUPLING (pure EDE test)
# ============================================================================
beta_ridder = 0.0

# ============================================================================
# SHOOTING: OFF for anchor test
# ============================================================================
ridder_use_shooting_EDE = no

# ============================================================================
# Evolution controls
# ============================================================================
ridder_c_slow = 1.0
ridder_force_damping = 1.0
ridder_freeze_phi = no

# ============================================================================
# Outputs
# ============================================================================
output = tCl
write background = yes
background_verbose = 2
write parameters = yes
root = output/axiclass_anchor_

# Precision
tol_background_integration = 1e-6

# ============================================================================
# VALIDATION CHECKLIST:
# ============================================================================
# 
# [ ] Does CLASS complete without "too much non-radiation" error?
# [ ] Is there a visible EDE bump in f_ridder(z)?
# [ ] Does f_peak fall in range 0.05-0.20?
# [ ] Does z_peak fall in range 1000-10000?
# [ ] Is w(z) qualitatively correct (w<-1 → kinetic → oscillatory)?
#
# If ALL YES → This is our anchor point
# Then: Narrow shooting bracket to [0.5e5, 2e5] H0 and re-enable shooting
#
# If bump too strong → Reduce f_axion systematically (try 0.2, 0.1, 0.05)
# If bump too weak → Increase m_axion or adjust theta_i
# If no bump → Check unit conversions again
#
# ============================================================================

