# ============================================================================
# AXICLASS PROPER ANCHOR v2 - Using Lambda_EDE directly
# ============================================================================
#
# KEY INSIGHT: AxiCLASS's m²f² with f = 0.1 M_Pl gives V_scale ~ 10^46 eV^4
# which is WAY too large. They must use internal normalization we don't have.
#
# ALTERNATIVE: Use Lambda_EDE directly (standard EDE papers use Λ ~ 0.1-1 eV)
# V = Lambda_EDE^4 * [1 - cos(theta)]^n * W(theta)
#
# This bypasses the m×f unit issue entirely.
#
# ============================================================================

# Standard ΛCDM
H0 = 67.36
omega_b = 0.02238280
omega_cdm = 0.1201075
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
gauge = newtonian

# ============================================================================
# RIDDER FIELD: Lambda-based EDE
# ============================================================================
use_ridder = yes
ridder_model_type = unified

# Component toggles: SHELF ONLY
ridder_use_tail = no
ridder_use_shelf = yes
ridder_use_plateau = no

# ============================================================================
# PARAMETERS USING LAMBDA_EDE DIRECTLY
# ============================================================================

# Energy scale: Lambda_EDE ~ 0.5-2 eV gives f_EDE ~ 5-15%
# Start conservative
ridder_Lambda_EDE_eV = 1.0

# Initial field position (from AxiCLASS theta_i)
theta_i_ridder = 2.72

# Potential shape: n = 3 (standard EDE)
ridder_n_EDE = 3.0

# Initial values for shooting
# f_axion = 0.0002 gives ~2x more energy → higher f_EDE
ridder_m_axion = 100.0
ridder_f_axion = 0.0002

# Decay constant for theta = phi/f mapping
# MUST MATCH f_eV from f_axion! f_eV = 0.0002 * M_Pl = 4.87e23 eV
ridder_f = 4.87e23

# ============================================================================
# SHELF WINDOW - Wide window to catch field evolution
# ============================================================================
ridder_theta_EDE_low = 0.1
ridder_theta_EDE_high = 4.0
ridder_sigma_theta_EDE = 0.3

# ============================================================================
# NO COUPLING
# ============================================================================
beta_ridder = 0.0

# ============================================================================
# SHOOTING ON - Test with fixed z_search range
# ============================================================================
ridder_use_shooting_EDE = yes
ridder_f_EDE_target = 0.10
ridder_z_c_target = 3500
# m=100 gives f=6.1%, m=10000 fails
# Need m_high that gives f>10% but still runs
# Try smaller m_high and slightly larger f_axion
ridder_shooting_m_min = 50.0
ridder_shooting_m_max = 500.0
ridder_shooting_tolerance = 0.01
ridder_shooting_max_iterations = 30

# ============================================================================
# Evolution controls
# ============================================================================
ridder_c_slow = 1.0
ridder_force_damping = 1.0
ridder_freeze_phi = no

# ============================================================================
# Outputs
# ============================================================================
output = tCl
write background = yes
background_verbose = 2
write parameters = yes
root = output/axiclass_proper_v2_

# Precision
tol_background_integration = 1e-5

# ============================================================================
# With Lambda_EDE = 1.0 eV:
#   V ~ (1 eV)^4 * [1-cos(2.72)]^3 ~ 1 eV^4 * (1.9)^3 ~ 7 eV^4
# This is MUCH more reasonable cosmologically
# ============================================================================
