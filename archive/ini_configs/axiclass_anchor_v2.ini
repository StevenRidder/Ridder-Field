# ============================================================================
# AXICLASS ANCHOR V2 - Conservative Parameters
# ============================================================================
# 
# Strategy: Start VERY weak, confirm field evolves without crashing
# Then scale up systematically if bump too small
#
# Key insight from failures:
#   - f=0.4 M_Pl, theta_i=2.8: WAY too strong (Omega_nonr=4.0)
#   - f=0.01 M_Pl, theta_i=0.1: Numerical stiffness
#
# New approach:
#   - Start near potential minimum (theta_i << 1)
#   - Small m so field rolls slowly
#   - Moderate f for manageable energy scale
#
# ============================================================================

# Standard ΛCDM
H0 = 67.36
omega_b = 0.02238280
omega_cdm = 0.1201075
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
YHe = 0.2454
gauge = newtonian

# ============================================================================
# RIDDER FIELD: Conservative EDE test
# ============================================================================
use_ridder = yes
ridder_model_type = unified

# Component toggles: SHELF ONLY
ridder_use_tail = no
ridder_use_shelf = yes
ridder_use_plateau = no

# ============================================================================
# CONSERVATIVE PARAMETERS
# ============================================================================

# SCALING UP from v2: m=10, f=0.001 was TOO WEAK (rho~10^-15)
# Problem with m=100, theta_i=0.01: Field oscillates at minimum (stiff ODE)
# Solution: Start farther from minimum so field ROLLS through EDE window
ridder_m_axion = 100.0

# Increased decay constant for more energy
ridder_f_axion = 0.01

# Start at pi radians: field will roll down toward minimum
# This should create EDE bump as it passes through the window
theta_i_ridder = 3.14159

# Potential shape
ridder_n_EDE = 3.0

# ============================================================================
# SHELF WINDOW - Match expected field range
# ============================================================================
# For theta_i = pi, field rolls from pi toward 0
# Set window to catch the roll-down: [0.5, 2.5]
ridder_theta_EDE_low = 0.5
ridder_theta_EDE_high = 2.5
ridder_sigma_theta_EDE = 0.3

# ============================================================================
# NO COUPLING
# ============================================================================
beta_ridder = 0.0

# ============================================================================
# SHOOTING OFF
# ============================================================================
ridder_use_shooting_EDE = no

# ============================================================================
# Evolution controls
# ============================================================================
ridder_c_slow = 1.0
ridder_force_damping = 1.0
ridder_freeze_phi = no

# ============================================================================
# Outputs
# ============================================================================
output = tCl
write background = yes
background_verbose = 2
write parameters = yes
root = output/axiclass_anchor_v2_

# Precision - relaxed for oscillating field
tol_background_integration = 1e-5
smallest_allowed_variation = 1e-30

# ============================================================================
# EXPECTED OUTCOMES:
# ============================================================================
# 
# BEST CASE: Weak but visible EDE bump (f_peak ~ 0.01-0.05)
#   → Scale up m or f_axion to increase bump height
#   → This is our anchor point!
#
# STILL TOO STRONG: "Too much non-radiation" error
#   → Reduce f_axion further (try 0.0001)
#   → Or reduce theta_i to 0.001
#
# TOO WEAK: f_peak < 0.001 or no visible bump
#   → Increase m_axion (try 50, 100)
#   → Or increase theta_i to 0.05
#
# NUMERICAL ISSUES: Stiffness errors
#   → Increase tol_background_integration to 1e-5
#   → Reduce m_axion if oscillating too fast
#
# ============================================================================

