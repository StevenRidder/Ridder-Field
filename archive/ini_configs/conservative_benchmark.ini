# Conservative Benchmark Configuration
# ΔH₀ = +3.14 km/s/Mpc, Max CMB Δ = 37.1%
# Use this for: Safe MCMC starting point, likelihood work

# Standard cosmological parameters
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field: EDE sector
Lambda_EDE_ridder = 1.5           # eV - optimal from Lambda scan
f_axion_ridder = 2.435e27         # M_Pl
theta_i_ridder = 1.0              # Optimal initial angle
n_ridder = 3                      # Plateau power (optimal)

# Ridder field: CDM coupling (BREAKTHROUGH)
beta_ridder = 0.15                # Conservative coupling strength
beta_z_c = 3000.0                 # Coupling peak at EDE epoch
beta_sigma_z = 0.5                # Moderate width in log(1+z)

# Ridder field: Dynamics control
ridder_c_slow = 1.0
ridder_freeze_phi = no
ridder_force_damping = 1.0
ridder_perturbation_mode = 0      # Scalar mode

# Outputs
gauge = newtonian
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0

write background = yes
write thermodynamics = yes
write perturbations = no

root = output/conservative_benchmark_

