# Test freeze mode ON with realistic Lambda
# This should integrate quickly to z=0 with field completely frozen

H0 = 70.0
omega_b = 0.0224
omega_cdm = 0.120
A_s = 2.1e-9
n_s = 0.965
tau_reio = 0.054
YHe = 0.245
gauge = newtonian

# Ridder field with REALISTIC Lambda (not shooting, hand-picked)
use_ridder_shooting = 0          # 0=disabled, 1=enabled
Lambda_EDE_ridder = 1e-50        # Small amplitude for quick test
f_axion_ridder = 2.435e27        # M_Pl scale
theta_i_ridder = 1.5             # Displaced field
beta_ridder = 0.0                # No DM coupling
n_ridder = 3                     # Cosine^3 potential
ridder_c_slow = 0.0              # Start Hubble-frozen

# Freeze mode ON - field acts as tiny cosmological constant
ridder_freeze_phi = yes
ridder_force_damping = 0.0       # Redundant but explicit

output = 
write background = no

