#######################################################################
# PURE EDE BENCHMARK - Track 1 (Simple Lambda approach)
#######################################################################
#
# Goal: Reproduce EDE-like behavior using Lambda_EDE scale
# This uses the same approach as Track 2 tail (which works)
#
# Key insight: The m²f² formulation is causing numerical issues.
# Instead, use Lambda_EDE⁴ [1-cos(θ)]^n directly.
#
#######################################################################

#------ Output ------
output = tCl,mPk
root = output/pure_ede

#------ Background (Planck-like) ------
H0 = 67.36
T_cmb = 2.7255
omega_b = 0.02238280
omega_cdm = 0.1201075

#------ Primordial ------
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
k_pivot = 0.05

#------ Ridder Pure EDE Mode ------
use_ridder = yes
ridder_model_type = unified
gauge = newtonian

# TAIL: ON as baseline dark energy
ridder_use_tail = yes
ridder_Lambda_tail_eV = 1.6e-3
ridder_alpha_tail = 1.0
ridder_n_tail = 1.0

# SHELF: OFF for now (m²f² approach has issues)
# We'll enable this once we fix the scale
ridder_use_shelf = no

# PLATEAU: OFF
ridder_use_plateau = no

# Field parameters
ridder_f = 1.0e26
theta_i_ridder = 0.5

# No coupling
beta_ridder = 0.0

# Frozen initial conditions
ridder_c_slow = 0.0

#------ Precision ------
l_max_scalars = 2500
P_k_max_h/Mpc = 1.7
tol_background_integration = 1e-5

#------ Output ------
write background = yes
background_verbose = 1
