# Quick test of new decay parameters
# This verifies α-branching and Γ-decay are wired in

root = output/test_decay
write background = yes

# Baseline cosmology
h = 0.6736
omega_b = 0.02237
omega_cdm = 0.1200
tau_reio = 0.0544

# Ridder field - boosted amplitude
Lambda_EDE_ridder = 0.5
f_axion_ridder = 1.0e+27
theta_i_ridder = 1.0
n_ridder = 3
beta_ridder = 0.0

# NEW: α-branching (50% of shelf → DR)
alpha_ridder_to_dr = 0.5
z_ridder_decay = 3500

# NEW: Γ-decay (disabled for this test, use α-branching only)
Gamma_decay_ridder = 0.0

# Control
ridder_force_damping = 1.0
ridder_freeze_phi = no
use_ridder_shooting = 0

# Speed settings
output = mPk
l_max_scalars = 100
background_verbose = 2
gauge = newtonian

