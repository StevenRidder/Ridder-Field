      min: 60
      max: 80
    ref: 67.18
    proposal: 0.5
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.02216
    proposal: 0.0002
  omega_cdm:
    prior:
      min: 0.09
      max: 0.14
    ref: 0.12013
    proposal: 0.002
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0582
    proposal: 0.01
  Lambda_EDE_ridder:
    prior:
      min: 0.01
      max: 0.15
    ref: 0.0587
    proposal: 0.01
  A_planck:
    prior:
      min: 0.9
      max: 1.1
    ref: 1.0
    proposal: 0.002
  A_sh:
    derived: 'lambda Lambda_EDE_ridder: Lambda_EDE_ridder / 0.041'
    latex: A_\mathrm{sh}
  sigma8:
    latex: \sigma_8
  S8:
