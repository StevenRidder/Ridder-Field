# P2_ACT_HIGH_THETA: Test high-amplitude EDE island
# ACT DR6 + Planck lowℓ only (most permissive)
# θ_i is now a SAMPLED parameter, not fixed
# Includes α-branching decay

packages_path: /home/azureuser/packages

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: true
      gauge: newtonian
      recombination: recfast
      non_linear: none
      n_ridder: 3
      beta_ridder: 0.0
      f_axion_ridder: 1.0e+27
      # NOTE: theta_i_ridder is now a sampled parameter below
      # NOTE: alpha_ridder_to_dr is now a sampled parameter below

  mflike.BandpowerForeground:
    experiments: [dr6_pa4_f220, dr6_pa5_f090, dr6_pa5_f150, dr6_pa6_f090, dr6_pa6_f150]
    bandint_freqs: [220, 90, 150, 90, 150]
    beam_profile:
      beam_from_file: null

likelihood:
  # Minimal CMB: Planck lowℓ + ACT DR6 only
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  act_dr6_mflike.ACTDR6MFLike:
  # NO lensing, NO BAO, NO SN - maximally permissive

params:
  # Base ΛCDM
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 70.0  # Start higher
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.117
    proposal: 0.003
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # Ridder EDE parameters
  Lambda_EDE_ridder:
    prior: {min: 0.1, max: 1.5}  # Higher range
    ref: 0.5
    proposal: 0.1
    latex: \Lambda_{EDE}

  # NEW: θ_i is now sampled!
  theta_i_ridder:
    prior: {min: 0.8, max: 2.5}  # Allow high values
    ref: 1.5
    proposal: 0.2
    latex: \theta_i

  # α-branching: Start with zero to test pure geometry first
  # If geometric EDE works, can add decay in follow-up run
  alpha_ridder_to_dr:
    value: 0.0  # FIXED at zero for Priority 1 run
    # To enable: prior: {min: 0.0, max: 0.5}, ref: 0.2
    latex: \alpha_{DR}

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s

sampler:
  mcmc:
    max_samples: 5000
    Rminus1_stop: 0.03
    burn_in: 100
    learn_proposal: true
    max_tries: 30000
    proposal_scale: 1.5

output: chains/p2_act_high_theta
resume: false

