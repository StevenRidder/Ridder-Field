#######################################################################
# TRACK 1: SHELF-ONLY EDE BENCHMARK
#######################################################################
# CALIBRATED CONFIGURATION:
#   m_axion = 7e4, f_axion = 0.20
#   f_EDE = 0.091 at z_peak = 4008
#
# This is the SHELF-ONLY configuration for Track 1 validation.
# No tail, no plateau, no coupling - pure EDE test.
#######################################################################

#------ Output ------
output = tCl,pCl,mPk
root = output/ede_benchmark

#------ Background (Planck-like) ------
H0 = 67.36
T_cmb = 2.7255
omega_b = 0.02238280
omega_cdm = 0.1201075

#------ Primordial ------
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
k_pivot = 0.05

#------ Ridder Shelf-Only EDE ------
use_ridder = yes
ridder_model_type = unified
gauge = newtonian

# TAIL: OFF
ridder_use_tail = no

# SHELF: ON - stronger EDE for larger H0 shift
ridder_use_shelf = yes
ridder_m_axion = 7e4
ridder_f_axion = 0.25
ridder_n_EDE = 3.0
ridder_theta_EDE_low = 0.5
ridder_theta_EDE_high = 3.5
ridder_sigma_theta_EDE = 0.5

# PLATEAU: OFF
ridder_use_plateau = no

# Field parameters
ridder_f = 7.305e26
theta_i_ridder = 2.5

# No coupling
beta_ridder = 0.0

# Initial conditions
ridder_c_slow = 0.0

#------ Precision ------
l_max_scalars = 2500
P_k_max_h/Mpc = 1.7

#------ Output ------
write background = yes
background_verbose = 1

