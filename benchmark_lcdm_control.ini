# Phase 3: ΛCDM Control Configuration
# Ridder field at extremum (theta=pi), frozen to act as pure cosmological constant
# Purpose: Standard cosmology baseline for comparison

# Standard cosmological parameters (Planck 2018 baseline)
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field configured as effective Lambda (from Phase 1 extremum calibration)
Lambda_EDE_ridder = 0.00930572
f_axion_ridder = 2.435e27
theta_i_ridder = 3.14159265359
beta_ridder = 0.0
n_ridder = 3
ridder_c_slow = 0.0

# FREEZE MODE: Field acts as pure cosmological constant
ridder_freeze_phi = yes
ridder_force_damping = 0.0
use_ridder_shooting = 0

# Gauge
gauge = newtonian

# Output: Full perturbations and CMB spectra
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0

# Write files
write background = yes
write thermodynamics = yes
write primordial = yes
k_output_values = 0.01

# Output directory
root = output/benchmark_lcdm_control_

