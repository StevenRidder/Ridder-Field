# Phase 1.1A: ΛCDM Recovery via Freeze Mode
# Goal: Ridder field frozen at constant value acts as effective Λ
# Should reproduce standard ΛCDM H(z), Ω's, and age

# Standard cosmological parameters (Planck 2018 baseline)
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454
gauge = newtonian

# Ridder field configured as effective Lambda
# For Ω_Λ,0 ≈ 0.7, need rho_ridder,0 ≈ 3 H₀² Ω_Λ,0 / (8πG)
# In CLASS units: H₀² ≈ 10⁻⁶ Mpc⁻², so rho_Λ ~ 0.7 × 10⁻⁶ Mpc⁻²
#
# V_ridder (eV⁴) converts to Mpc⁻² via:
#   rho = V × (eV_to_Mpc_inv² / 3M_Pl²)
#   where eV_to_Mpc_inv ≈ 1.56×10²⁹, M_Pl ≈ 2.44×10²⁷ eV
#
# So: V_needed ≈ rho_target × 3M_Pl² / eV_to_Mpc_inv²
#            ≈ 7×10⁻⁷ × 3×(2.44×10²⁷)² / (1.56×10²⁹)²
#            ≈ 5×10⁴⁷ / 2.4×10⁵⁸
#            ≈ 2×10⁻¹¹ eV⁴
#
# V_ridder = Λ⁴ × [1-cos(φ/f)]ⁿ
# With theta_i = 1.5, [1-cos(1.5)]³ ≈ 2.84
# So: Λ⁴ × 2.84 ≈ 2×10⁻¹¹
#     Λ ≈ (7×10⁻¹²)^(1/4) ≈ 9×10⁻⁴ eV

Lambda_EDE_ridder = 9e-4
f_axion_ridder = 2.435e27
theta_i_ridder = 1.5
beta_ridder = 0.0
n_ridder = 3
ridder_c_slow = 0.0

# FREEZE MODE: Field acts as pure cosmological constant
ridder_freeze_phi = yes
ridder_force_damping = 0.0

# No shooting - we're testing fixed Lambda
use_ridder_shooting = 0

# Output settings
output = tCl,pCl,lCl,mPk
l_max_scalars = 2500
P_k_max_h/Mpc = 1.0
z_pk = 0

write background = yes
write thermodynamics = yes

# Format for easy comparison
format = class

