#############################################
# Pure ΛCDM Baseline
# Planck 2018 best-fit parameters
# For comparison with unified Ridder models
#############################################

# Standard cosmological parameters
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# No Ridder field
use_ridder = no

# Output settings
gauge = newtonian
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0
z_pk = 0  # For S8 calculation

write background = yes
background_verbose = 2
write thermodynamics = no
write parameters = yes

root = output/lcdm_baseline_

