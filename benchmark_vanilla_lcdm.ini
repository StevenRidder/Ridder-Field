# Phase 3: Vanilla ΛCDM Control
# Standard CLASS ΛCDM with NO Ridder field
# Purpose: Clean baseline for EDE comparison

# Standard cosmological parameters (Planck 2018 baseline)
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# NO Ridder field - pure ΛCDM
Lambda_EDE_ridder = 0.0

# Gauge
gauge = newtonian

# Output: Full perturbations and CMB spectra
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0

# Write files
write background = yes
write thermodynamics = yes
write primordial = yes
k_output_values = 0.01

# Output directory
root = output/benchmark_vanilla_lcdm_

