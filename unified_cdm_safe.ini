#############################################
# Ridder Unified Potential: Safe Configuration
# Maps to v2 conservative benchmark (β=0.15, σ_z=0.5)
# Expected: ΔH₀ ≈ +3.14 km/s/Mpc, Max CMB Δ ≈ 37%
#############################################

# Standard cosmological parameters
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field: Unified potential
use_ridder = yes
ridder_model_type = unified

# Trigger for has_ridder flag (v2 compatibility)
Lambda_EDE_ridder = 1.5
f_axion_ridder = 2.435e27
theta_i_ridder = 1.0

# Global field scale
ridder_f = 2.435e27  # M_Pl in eV (same as v2)

# Tail: Late dark energy
ridder_use_tail = yes
ridder_Lambda_tail_eV = 2.3e-3  # meV scale for Omega_Lambda ~ 0.7
ridder_n_tail = 3.0

# Shelf: EDE bump (mapped from v2 optimal)
ridder_use_shelf = yes
ridder_Lambda_EDE_eV = 1.5      # From v2 Lambda scan
ridder_n_EDE = 3.0              # From v2 n scan

# Shelf window: where field is active during EDE epoch
# v2 used theta_i ~ 1.0, field rolls through [0.5, 2.0]
ridder_theta_EDE_low = 0.5
ridder_theta_EDE_high = 2.0
ridder_sigma_theta_EDE = 0.2    # Smooth edges

# Plateau: OFF for standard cosmology runs
ridder_use_plateau = no
ridder_Lambda_inf_eV = 1.0e-3
ridder_theta0_inf = 5.0
ridder_theta_inf_on = 8.0
ridder_sigma_inf = 1.0
ridder_n_inf = 1.0

# CDM coupling: Safe configuration (v2 conservative)
beta_ridder = 0.15              # Safe: better CMB quality
beta_z_c = 3000.0               # Peak at EDE epoch
beta_sigma_z = 0.5              # Optimal width from grid search

# Dynamics control (from v2)
ridder_c_slow = 1.0
ridder_freeze_phi = no
ridder_force_damping = 1.0
ridder_perturbation_mode = 0    # Scalar mode

# Output settings
gauge = newtonian
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0
z_pk = 0  # For S8 calculation

write background = yes
background_verbose = 2
write thermodynamics = no
write parameters = yes

root = output/unified_cdm_safe_

