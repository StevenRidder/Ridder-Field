#######################################################################
# RIDDER TAIL MINIMAL MODEL - Track 2 Canonical Baseline
#######################################################################
# 
# Target observables:
#   H0     = 73 km/s/Mpc
#   S8     = 0.747
#   Omega_m ~ 0.27
#   w(z=0) ~ -1.0 (CC-like)
#   Age    ~ 13.3 Gyr
#
# Created: November 24, 2024
# Commit: 5f60419 (v2-development)
# Label: Track 2 minimal model - tail only, no EDE shelf, no CDM coupling
#
#######################################################################

#------ Output ------
output = tCl,pCl,mPk
root = output/track2_minimal

#------ Background parameters ------
# Use Planck-like base cosmology
H0 = 67.36
T_cmb = 2.7255
omega_b = 0.02238280
omega_cdm = 0.1201075

#------ Primordial ------
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
k_pivot = 0.05

#------ Ridder Unified Tail Model ------
# This is the minimal Ridder configuration that acts as dynamical dark energy

use_ridder = yes
ridder_model_type = unified
gauge = newtonian

# Tail: Late-time dark energy
# V_tail = Lambda^4 * [1 + alpha * (1 - cos(theta))^n]
# At theta=0: V = Lambda^4 (cosmological constant floor)
ridder_use_tail = yes
ridder_Lambda_tail_eV = 1.6e-3
ridder_alpha_tail = 1.0
ridder_n_tail = 1.0

# Field decay constant and initial angle
ridder_f = 1.0e26
theta_i_ridder = 0.5

# Shelf: OFF (EDE component disabled for minimal model)
ridder_use_shelf = no
ridder_Lambda_EDE_eV = 0.0

# Plateau: OFF (inflation component disabled)
ridder_use_plateau = no

# CDM Coupling: OFF (explicitly disabled for minimal model)
beta_ridder = 0.0
ridder_sigma_z = 0.5
ridder_zc = 3300.0

# Slow roll and shooting (disabled)
ridder_c_slow = 1.0
ridder_use_shooting_EDE = no

#------ Precision ------
l_max_scalars = 2500
P_k_max_h/Mpc = 1.7
k_per_decade_for_pk = 10
k_per_decade_for_bao = 80
tol_background_integration = 1e-5

#------ Output options ------
write background = yes
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1

