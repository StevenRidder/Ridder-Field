theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl
      l_max_scalars: 2508
      lensing: "yes"
      gauge: newtonian
      recombination: recfast
      use_ridder: "yes"
      ridder_model_type: v3_canon
      ridder_use_shelf: "yes"
      ridder_use_tail: "no"
      ridder_f_eV: 2.0e26
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0
      beta_ridder: 0.15
      beta_z_c: 3000.0
      beta_sigma_z: 0.5

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null

params:
  logA: {prior: {min: 2.5, max: 3.5}, ref: 3.044, proposal: 0.01, drop: true}
  A_s: {value: 'lambda logA: 1e-10*np.exp(logA)'}
  n_s: {prior: {min: 0.88, max: 1.02}, ref: 0.9649, proposal: 0.004}
  H0: {prior: {min: 60, max: 80}, ref: 68.0, proposal: 0.8}
  omega_b: {prior: {min: 0.018, max: 0.026}, ref: 0.02237, proposal: 0.0003}
  omega_cdm: {prior: {min: 0.08, max: 0.16}, ref: 0.1200, proposal: 0.003}
  tau_reio: {prior: {min: 0.01, max: 0.12}, ref: 0.0544, proposal: 0.008}
  ridder_Lambda_EDE_eV: {prior: {min: 0.30, max: 0.60}, ref: 0.45, proposal: 0.05}
  ridder_a_c: {prior: {min: 2.0e-4, max: 4.0e-4}, ref: 3.1e-4, proposal: 2.0e-5}
  ridder_sigma_lna: {prior: {min: 0.40, max: 0.75}, ref: 0.55, proposal: 0.05}
  rs_drag: {latex: r_s}

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.05
    burn_in: 50
    drag: false
    proposal_scale: 2.4

output: chains/tier5_v3_baseline
debug: false
resume: false
