# BASELINE: ΛCDM + Planck + BAO + SH0ES (NO Ridder/EDE)
# Purpose: Compare V3 Ridder H0 against standard ΛCDM H0

theory:
  classy:
    extra_args:
      output: tCl, mPk
      l_max_scalars: 2508
      lensing: "yes"
      gauge: newtonian
      recombination: recfast
      # NO Ridder - pure ΛCDM

likelihood:
  # Planck 2018 FULL
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  
  # BAO
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null

params:
  # --- Standard ΛCDM ---
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.001
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.00}
    ref: 0.9649
    proposal: 0.003
    latex: n_s
  
  # H0 with SH0ES Gaussian prior
  H0:
    prior:
      dist: norm
      loc: 73.04
      scale: 1.04
    ref: 70.0
    proposal: 1.5
    latex: H_0
  
  omega_b:
    prior: {min: 0.021, max: 0.024}
    ref: 0.02237
    proposal: 0.00015
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.1200
    proposal: 0.001
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.10}
    ref: 0.0544
    proposal: 0.005
    latex: \tau_{reio}

sampler:
  mcmc:
    max_samples: 200
    Rminus1_stop: 0.2
    burn_in: 20
    drag: true
    measure_speeds: true
    proposal_scale: 2.4

output: chains/baseline_lcdm
debug: false
resume: false

