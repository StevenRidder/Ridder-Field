# V3 TRGB: Test compatibility with TRGB H0 measurement
# H0 prior: 69.8 ± 1.7 km/s/Mpc (Freedman et al. 2024)
# Runtime: ~30-40 hours on D16s_v3
# Purpose: Quantify tension/cost to accommodate TRGB

theory:
  classy:
    path: /home/ridderadmin/Ridder-Field/phase2/class
    extra_args:
      output: tCl, mPk, lCl
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      recombination: recfast
      non_linear: none
      
      # V3 Ridder configuration
      use_ridder: yes
      ridder_model_type: v3_canon
      
      # EDE component - bump at origin, field starts displaced
      ridder_use_shelf: yes
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      
      # Tail component
      ridder_use_tail: yes
      ridder_alpha_tail: 1.0
      ridder_theta_T_center: 0.0
      ridder_n_tail: 1.0
      
      # Floor (disabled)
      ridder_Lambda_floor_eV: 0.0
      
      # Field normalization
      ridder_f_eV: 1.0
      
      # Initial conditions
      theta_i_ridder: 2.4
      ridder_c_slow: 0.0

likelihood:
  # Planck 2018 Full
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  
  # BAO
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  
  # Supernovae
  sn.pantheon: null
  
  # TRGB H0 prior (external likelihood)
  trgb_h0:
    external: |
      lambda _self=None, H0=None, **params_values: (
        -0.5 * ((H0 - 69.8) / 1.7)**2
      )
    requires:
      H0:
        latex: H_0

params:
  # --- Standard ΛCDM ---
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
    latex: A_s
  
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  
  H0:
    prior: {min: 60, max: 80}
    ref: 69.8  # Start at TRGB value
    proposal: 0.5
    latex: H_0
  
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.02237
    proposal: 0.0001
    latex: \Omega_b h^2
  
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.1200
    proposal: 0.001
    latex: \Omega_c h^2
  
  tau_reio:
    prior: {min: 0.04, max: 0.08}
    ref: 0.0544
    proposal: 0.004
    latex: \tau_{reio}
  
  # --- V3 Ridder Parameters ---
  
  # EDE amplitude
  ridder_Lambda_EDE_eV:
    prior: {min: 0.0, max: 0.80}
    ref: 0.321  # Start at TRGB calibrated value
    proposal: 0.04
    latex: \Lambda_{EDE}
  
  # Tail amplitude
  ridder_Lambda_tail_eV:
    prior: {min: 0.0, max: 0.003}  # 0 to 3 meV
    ref: 0.0012  # Start at TRGB calibrated value (1.2 meV)
    proposal: 0.0002
    latex: \Lambda_{tail}
  
  # EDE peak redshift
  ridder_a_c:
    prior: {min: 2.0e-4, max: 1.0e-3}
    ref: 4.8e-4
    proposal: 5.0e-5
    latex: a_c
  
  # EDE width
  ridder_sigma_lna:
    prior: {min: 0.5, max: 2.0}
    ref: 1.0
    proposal: 0.10
    latex: \sigma_{\ln a}
  
  # --- Planck Nuisance Parameters (same as baseline) ---
  A_planck:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.002
    latex: y_{\rm cal}
  
  calib_100T:
    prior: {min: 0.98, max: 1.02}
    ref: 0.9992
    proposal: 0.0004
  calib_217T:
    prior: {min: 0.98, max: 1.02}
    ref: 0.9985
    proposal: 0.0004
  A_pol:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.005
  calib_100P:
    value: 1.021
  calib_143P:
    value: 0.966
  calib_217P:
    value: 1.04
  
  # Foregrounds (TT)
  cib_index:
    value: -1.3
  A_cib_217:
    prior: {min: 0, max: 200}
    ref: 67
    proposal: 6.5
  xi_sz_cib:
    prior: {min: 0, max: 1}
    ref: 0.1
    proposal: 0.1
  A_sz:
    prior: {min: 0, max: 10}
    ref: 7.0
    proposal: 2.0
  ksz_norm:
    prior: {min: 0, max: 10}
    ref: 0.0
    proposal: 2.5
  gal545_A_100:
    prior: {min: 0, max: 50}
    ref: 7.0
    proposal: 2.0
  gal545_A_143:
    prior: {min: 0, max: 50}
    ref: 9.0
    proposal: 2.0
  gal545_A_143_217:
    prior: {min: 0, max: 100}
    ref: 21.0
    proposal: 8.5
  gal545_A_217:
    prior: {min: 0, max: 400}
    ref: 80.0
    proposal: 20.0
  A_sbpx_100_100_TT:
    value: 1.0
  A_sbpx_143_143_TT:
    value: 1.0
  A_sbpx_143_217_TT:
    value: 1.0
  A_sbpx_217_217_TT:
    value: 1.0
  ps_A_100_100:
    prior: {min: 0, max: 400}
    ref: 257.0
    proposal: 30.0
  ps_A_143_143:
    prior: {min: 0, max: 400}
    ref: 47.0
    proposal: 10.0
  ps_A_143_217:
    prior: {min: 0, max: 400}
    ref: 40.0
    proposal: 12.0
  ps_A_217_217:
    prior: {min: 0, max: 400}
    ref: 104.0
    proposal: 13.0
  
  # Foregrounds (TE/EE)
  galf_TE_index:
    value: -2.4
  galf_TE_A_100:
    prior: {min: 0, max: 10}
    ref: 0.13
    proposal: 0.042
  galf_TE_A_100_143:
    prior: {min: 0, max: 10}
    ref: 0.13
    proposal: 0.036
  galf_TE_A_100_217:
    prior: {min: 0, max: 10}
    ref: 0.46
    proposal: 0.09
  galf_TE_A_143:
    prior: {min: 0, max: 10}
    ref: 0.207
    proposal: 0.072
  galf_TE_A_143_217:
    prior: {min: 0, max: 10}
    ref: 0.69
    proposal: 0.09
  galf_TE_A_217:
    prior: {min: 0, max: 10}
    ref: 1.938
    proposal: 0.54
  galf_EE_index:
    value: -2.4
  galf_EE_A_100:
    value: 0.055
  galf_EE_A_100_143:
    value: 0.04
  galf_EE_A_100_217:
    value: 0.094
  galf_EE_A_143:
    value: 0.086
  galf_EE_A_143_217:
    value: 0.21
  galf_EE_A_217:
    value: 0.7
  A_cnoise_e2e_100_100_EE:
    value: 1.0
  A_cnoise_e2e_143_143_EE:
    value: 1.0
  A_cnoise_e2e_217_217_EE:
    value: 1.0
  A_sbpx_100_100_EE:
    value: 1.0
  A_sbpx_100_143_EE:
    value: 1.0
  A_sbpx_100_217_EE:
    value: 1.0
  A_sbpx_143_143_EE:
    value: 1.0
  A_sbpx_143_217_EE:
    value: 1.0
  A_sbpx_217_217_EE:
    value: 1.0
  
  # Pantheon nuisance
  M:
    prior: {min: -20, max: -18}
    ref: -19.3
    proposal: 0.004
    latex: M

sampler:
  mcmc:
    max_samples: 10000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    measure_speeds: true
    oversample_power: 0.4
    drag: true

output: chains/v3_trgb
debug: false
resume: false

