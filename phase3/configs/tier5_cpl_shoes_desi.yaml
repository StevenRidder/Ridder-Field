# Tier 5: CPL with SH0ES + DESI Y1 BAO
# FIXED: Added Omega_Lambda: 0 for CPL mode
theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: yes
      non_linear: none
      recombination: recfast
      Omega_Lambda: 0

likelihood:
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  likelihoods.desi_y1_bao.DESI_Y1_BAO:
    python_path: /home/<VM_USER>/Ridder-Field/phase3
  sh0es_h0:
    external: 'lambda _self=None, H0=None, **p: -0.5 * ((H0 - 73.04) / 1.04)**2'
    requires:
      H0:
        latex: H_0

params:
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 69.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.12
    proposal: 0.002
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
  w0_fld:
    prior: {min: -2.0, max: 0.0}
    ref: -1.0
    proposal: 0.05
    latex: w_0
  wa_fld:
    prior: {min: -2.0, max: 2.0}
    ref: 0.0
    proposal: 0.1
    latex: w_a
  rs_drag:
    latex: r_s
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_m:
    latex: \Omega_m
    derived: true
  S8:
    latex: S_8
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.03
    burn_in: 0
    learn_proposal: true
    proposal_scale: 2.4

output: chains/tier5_cpl_shoes_desi
debug: false
resume: false
