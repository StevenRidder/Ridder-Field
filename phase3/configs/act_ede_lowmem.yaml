# ACT EDE Low-Memory Config
# Reduced l_max and precision for 15GB nodes

theory:
  classy:
    extra_args:
      output: tCl pCl lCl
      # REDUCED from 5000 to 3500 - saves ~2GB RAM
      l_max_scalars: 3500
      lensing: yes
      gauge: newtonian
      N_ncdm: 0
      non_linear: none
      # Reduced precision to save memory
      accurate_lensing: 0
      l_logstep: 1.04
      l_linstep: 40
      # Ridder field
      f_axion_ridder: 1.0e+27
      theta_i_ridder: 1.0
      beta_ridder: 0.0
      n_ridder: 3
    input_params:
      - A_s
      - n_s
      - H0
      - omega_b
      - omega_cdm
      - tau_reio
      - Lambda_EDE_ridder

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  act_dr6_mflike.ACTDR6MFLike:
    stop_at_error: false

params:
  logA:
    prior: {min: 2.5, max: 3.7}
    ref: 3.03
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.02}
    ref: 0.965
    proposal: 0.002
  H0:
    prior: {min: 64.0, max: 76.0}
    ref: 69.0
    proposal: 0.3
  omega_b:
    prior: {min: 0.020, max: 0.025}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.125
    proposal: 0.001
  tau_reio:
    prior: {min: 0.03, max: 0.10}
    ref: 0.05
    proposal: 0.005
  Lambda_EDE_ridder:
    prior: {min: 0.8, max: 1.2}
    ref: 1.0
    proposal: 0.02
  # ACT calibration - minimal set
  calG_all:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa4_f220: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  cal_dr6_pa5_f090: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  cal_dr6_pa5_f150: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  cal_dr6_pa6_f090: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  cal_dr6_pa6_f150: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  calE_dr6_pa4_f220: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  calE_dr6_pa5_f090: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  calE_dr6_pa5_f150: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  calE_dr6_pa6_f090: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}
  calE_dr6_pa6_f150: {prior: {min: 0.9, max: 1.1}, ref: 1.0, proposal: 0.01}

sampler:
  mcmc:
    Rminus1_stop: 0.03
    Rminus1_cl_stop: 0.15
    covmat: auto
    burn_in: 0.3
    max_tries: 10000
    drag: true
    proposal_scale: 1.8
    learn_proposal: true

output: chains/act_ede_lowmem
