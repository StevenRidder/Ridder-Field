theory:
  classy:
    input_params: [A_s, n_s, H0, omega_b, omega_cdm, tau_reio]
  classy:
    input_params: [A_s, n_s, H0, omega_b, omega_cdm, tau_reio]
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 9000
      lensing: true
      gauge: newtonian
      recombination: recfast
      non_linear: none
  mflike.BandpowerForeground:
    experiments:
    - dr6_pa4_f220
    - dr6_pa5_f090
    - dr6_pa5_f150
    - dr6_pa6_f090
    - dr6_pa6_f150
    bandint_freqs:
    - 220
    - 90
    - 150
    - 90
    - 150

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  act_dr6_mflike.ACTDR6MFLike:
    stop_at_error: true
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  sn.pantheonplus: null
  shoes_h0:
    external: 'lambda H0: -0.5*((H0 - 73.04)/1.04)**2'

params:
  # Cosmological parameters
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 68.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.12
    proposal: 0.003
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}
    
  # ACT calibration parameters
  bandint_shift_dr6_pa4_f220:
    prior: {dist: norm, loc: 0.0, scale: 3.6}
    ref: 0.0
    proposal: 1.8
  bandint_shift_dr6_pa5_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.0}
    ref: 0.0
    proposal: 0.5
  bandint_shift_dr6_pa5_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.3}
    ref: 0.0
    proposal: 0.65
  bandint_shift_dr6_pa6_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.2}
    ref: 0.0
    proposal: 0.6
  bandint_shift_dr6_pa6_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.1}
    ref: 0.0
    proposal: 0.55
  cal_dr6_pa4_f220:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa5_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa5_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa6_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa6_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa4_f220:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa5_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa5_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa6_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa6_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calG_all:
    prior: {dist: norm, loc: 1.0, scale: 0.02}
    ref: 1.0
    proposal: 0.01

  # Foreground parameters - TT
  a_tSZ:
    prior: {min: 0, max: 20}
    ref: 3.3
    proposal: 0.5
  a_kSZ:
    prior: {min: 0, max: 10}
    ref: 1.0
    proposal: 0.3
  a_p:
    prior: {min: 0, max: 50}
    ref: 6.9
    proposal: 1.0
  beta_p:
    value: 2.08
  a_c:
    prior: {min: 0, max: 20}
    ref: 4.9
    proposal: 0.5
  beta_c:
    value: 2.20
  a_s:
    prior: {min: 0, max: 50}
    ref: 3.1
    proposal: 0.5
  a_gtt:
    prior: {min: 0, max: 50}
    ref: 1.5
    proposal: 0.3
  a_gte:
    prior: {min: -5, max: 5}
    ref: 0.0
    proposal: 0.2
  a_gee:
    prior: {min: 0, max: 10}
    ref: 0.1
    proposal: 0.05
  a_psee:
    prior: {min: 0, max: 10}
    ref: 0.1
    proposal: 0.05
  a_pste:
    prior: {min: -5, max: 5}
    ref: 0.0
    proposal: 0.2
  xi:
    prior: {min: 0, max: 1}
    ref: 0.2
    proposal: 0.1
  
  # Spectral indices and dust - fixed to standard values
  alpha_s:
    value: -0.6
  beta_s:
    value: -2.5
  alpha_p:
    value: 1.0
  T_d:
    value: 9.7
  alpha_dT:
    value: 0.0
  alpha_dE:
    value: -0.4
  T_effd:
    value: 19.6
  beta_d:
    value: 1.5
  a_cibc:
    value: 4.9
  a_dust_tt:
    value: 5.0
  a_dust_ee:
    value: 0.4
  a_radio:
    value: 3.0
  alpha_tSZ:
    value: 0.0

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)'
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s

sampler:
  mcmc:
    max_samples: 5000
    Rminus1_stop: 0.02
    burn_in: 50
    learn_proposal: true
    max_tries: 50000
    proposal_scale: 2.0

output: chains/act_full_lcdm
resume: false
