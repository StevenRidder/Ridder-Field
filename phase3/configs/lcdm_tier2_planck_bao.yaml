# Tier 2 ΛCDM Baseline: Planck 2018 + BAO
# Control group for Tier 2 comparison

theory:
  classy:
    path: /home/ridderadmin/Ridder-Field/phase2/class
    extra_args:
      output: tCl, mPk, lCl
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      recombination: recfast
      non_linear: none

likelihood:
  # Planck 2018 Primary CMB
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  
  # BAO (Baryon Acoustic Oscillations)
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null

params:
  # --- STANDARD COSMOLOGY ONLY ---
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.965
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 67.4
    proposal: 0.5
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.06, max: 0.2}
    ref: 0.12
    proposal: 0.001
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.054
    proposal: 0.003

  # --- PLANCK NUISANCE PARAMETERS ---
  A_planck:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.0025
  calib_100T:
    prior: {min: 0.997, max: 1.003}
    ref: 1.0002
    proposal: 0.0004
  calib_217T:
    prior: {min: 0.995, max: 1.005}
    ref: 0.99805
    proposal: 0.0006

sampler:
  mcmc:
    max_samples: 200  # Quick test run
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2

output: chains/lcdm_tier2_test

