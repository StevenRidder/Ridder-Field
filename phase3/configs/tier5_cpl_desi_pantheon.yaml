# Tier 5 Phase 1b: CPL with DESI Y1 BAO + Pantheon+
# Tests: Does late-time DE improve full distance ladder?
# k = 8 parameters

theory:
  classy:
    extra_args:
      output: tCl, mPk
      l_max_scalars: 2508
      lensing: true
      gauge: newtonian
      recombination: recfast
      non_linear: none
      Omega_Lambda: 0

likelihood:
  # CMB
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  
  # Pre-DESI BAO
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  
  # DESI Y1 BAO
  likelihoods.desi_y1_bao.DESI_Y1_BAO:
    python_path: /home/ridderadmin/Ridder-Field/phase3
  
  # Pantheon+ SN
  sn.pantheonplus:

params:
  # Base ΛCDM (k=6)
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 67.5
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.120
    proposal: 0.002
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # CPL dark energy (k=8)
  w0_fld:
    prior: {min: -2.0, max: 0.0}
    ref: -1.0
    proposal: 0.05
    latex: w_0
  wa_fld:
    prior: {min: -2.0, max: 2.0}
    ref: 0.0
    proposal: 0.1
    latex: w_a

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rdrag:
    latex: r_s

sampler:
  mcmc:
    max_samples: 5000
    Rminus1_stop: 0.02
    burn_in: 100
    learn_proposal: true

output: chains/tier5_cpl_desi_pantheon

