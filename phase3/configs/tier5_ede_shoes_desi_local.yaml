# Tier 5: Geometric EDE with SH0ES + DESI Y1 BAO (Local)
# Key test: Does EDE survive DESI BAO while resolving H0 tension?

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: 'yes'
      gauge: newtonian
      recombination: recfast
      use_ridder: 'yes'
      # Fixed EDE parameters (monodromy-motivated)
      ridder_n_ridder: 3.0
      ridder_sigma_lna: 0.5
      ridder_theta_i: 1.0
      ridder_beta: 0.0

likelihood:
  # CMB
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  
  # DESI Y1 BAO (custom likelihood)
  likelihoods.desi_y1_bao.DESI_Y1_BAO:
    python_path: /Users/steveridder/Git/Ridder-Field/phase3
  
  # SH0ES H0 prior
  sh0es_h0:
    external: 'lambda _self=None, H0=None, **p: -0.5 * ((H0 - 73.04) / 1.04)**2'
    requires:
      H0:
        latex: H_0

params:
  # Base cosmology
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 70.5
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.118
    proposal: 0.002
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    
  # Geometric EDE parameters (k=8)
  ridder_Lambda_EDE_eV:
    prior: {min: 0.5, max: 3.0}
    ref: 1.8
    proposal: 0.2
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior: {min: 1e-4, max: 3e-3}
    ref: 3e-4
    proposal: 3e-5
    latex: a_c
    
  # Derived
  rs_drag:
    latex: r_s
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_m:
    latex: \Omega_m
    derived: true
  S8:
    latex: S_8
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.03
    burn_in: 0
    learn_proposal: true
    max_tries: 10000
    drag: false
    proposal_scale: 2.4

output: chains/tier5_ede_shoes_desi
debug: false
resume: false

