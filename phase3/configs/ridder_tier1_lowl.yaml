# Tier 1 Production: Planck 2018 Low-l Only
# Simplified for reliable operation without high-l data download issues
# This is still real Planck data, just the low-l portion

theory:
  classy:
    path: /home/ridderadmin/Ridder-Field/phase2/class
    extra_args:
      output: tCl, mPk, lCl
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      recombination: recfast
      non_linear: none
      # Ridder field parameters (fixed)
      Lambda_EDE_ridder: 1.0
      f_axion_ridder: 1.0e27  # eV (converted to Mpl internally)
      n_ridder: 3

likelihood:
  # Planck low-l data (always works, no download issues)
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null

params:
  # --- COSMOLOGY (Standard Priors) ---
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.965
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 67.4
    proposal: 0.5
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.120
    proposal: 0.001
  tau_reio:
    prior: {min: 0.04, max: 0.08}
    ref: 0.054
    proposal: 0.004

  # --- RIDDER PARAMETERS ---
  theta_i_ridder:
    prior: {min: 0.1, max: 2.3}
    ref: 2.1
    proposal: 0.05
    latex: \theta_i
  beta_ridder:
    prior: {min: 0.0, max: 0.03}
    ref: 0.0
    proposal: 0.005
    latex: \beta

sampler:
  mcmc:
    proposal_scale: 1.9
    covmat: auto
    Rminus1_stop: 0.05
    burn_in: 0
    max_samples: 5000

output: chains/ridder_tier1_production
resume: false
debug: true

