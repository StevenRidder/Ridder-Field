# Tier 1: Planck 2018 Only - Full Production Test
# This is the real data test with actual Planck likelihoods

theory:
  classy:
    path: /home/ridderadmin/Ridder-Field/phase2/class
    extra_args:
      use_scf: yes
      scf_potential: ridder
      scf_tuning_index: 1  # Tune Lambda (scf_parameters[1]) to match Omega_scf
      attractor_ic_scf: yes
      scf_phi_prime_ini: 0.0
      # scf_parameters: [f, Lambda, n] - Lambda will be tuned, f and n are fixed
      # f = 0.4 Mpl (from f_axion_ridder = 1e27 eV conversion)
      # Lambda = will be tuned by CLASS
      # n = 3
      scf_parameters: 0.4, 1.0, 3.0
      # Planck requires high l_max and lens calculation
      output: tCl, mPk, lCl
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      # Ridder field parameters (fixed)
      f_axion_ridder: 1.0e27  # eV (converted to Mpl internally)
      n_ridder: 3

likelihood:
  # THE REAL DATA
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null

params:
  # --- COSMOLOGY (Standard Priors) ---
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.965
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 67.4  # Start at Planck baseline
    proposal: 0.5
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.120
    proposal: 0.001
  tau_reio:
    prior: {min: 0.04, max: 0.08}
    ref: 0.054
    proposal: 0.004

  # --- RIDDER PARAMETERS ---
  # We let the model tune the energy scale (Lambda via Omega_scf)
  Omega_scf:
    prior: {min: 0.001, max: 0.15}
    ref: 0.05
    proposal: 0.01
    latex: f_{EDE}
  # The Critical Parameter (theta_i_ridder in CLASS)
  theta_i_ridder:
    prior: {min: 0.1, max: 2.3} # Can it survive near 2.1?
    ref: 1.5
    proposal: 0.1
    latex: \theta_i
  # Coupling (Let's see if Planck tolerates it)
  beta_ridder:
    prior: {min: 0.0, max: 0.03}
    ref: 0.0
    proposal: 0.005
    latex: \beta

sampler:
  mcmc:
    drag: true
    proposal_scale: 1.9
    covmat: auto
    Rminus1_stop: 0.05
    burn_in: 0
    max_samples: 200 # Quick test to verify it runs
    blocking:
      - [1, [logA, n_s, H0, omega_b, omega_cdm, tau_reio]]
      - [2, [Omega_scf, theta_i_ridder, beta_ridder]]

output: chains/ridder_tier1_planck
resume: true
debug: true

