# Phase 2: ACT DR6 World - ΛCDM (with proper foreground modeling)
# Based on ACT DR6 test configuration
# Likelihoods: Planck 2018 + Pre-DESI BAO + SH0ES + ACT DR6

theory:
  camb:
    extra_args:
      lens_potential_accuracy: 1
      lmax: 9000
  # ACT Foreground model
  mflike.BandpowerForeground:
    experiments:
      - dr6_pa4_f220
      - dr6_pa5_f090
      - dr6_pa5_f150
      - dr6_pa6_f090
      - dr6_pa6_f150
    bandint_freqs: [220, 90, 150, 90, 150]
    beam_profile:
      beam_from_file: null

likelihood:
  # Planck 2018 CMB
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  
  # ACT DR6 high-ℓ TT/TE/EE
  act_dr6_mflike.ACTDR6MFLike:
    stop_at_error: true
  
  # Pre-DESI BAO
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  
  # Pantheon+ Supernovae
  sn.pantheonplus:
  
  # SH0ES H0 prior
  shoes_h0:
    external: "lambda H0: -0.5*((H0 - 73.04)/1.04)**2"
    output_params: [chi2__shoes_h0]

params:
  # Base cosmology (using CAMB parameterization)
  cosmomc_theta:
    prior: {min: 0.0103, max: 0.0105}
    ref: 0.01040547
    proposal: 0.00001
    latex: \theta_{MC}
  As:
    prior: {min: 1.5e-9, max: 3.0e-9}
    ref: 2.127e-9
    proposal: 1e-11
    latex: A_s
  ombh2:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02262
    proposal: 0.0002
    latex: \Omega_b h^2
  omch2:
    prior: {min: 0.09, max: 0.14}
    ref: 0.1240
    proposal: 0.003
    latex: \Omega_c h^2
  ns:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9664
    proposal: 0.004
    latex: n_s
  tau:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0566
    proposal: 0.006
    latex: \tau_{reio}

  # ACT Foreground parameters (from best-fit)
  a_tSZ:
    prior: {min: 0, max: 20}
    ref: 3.5
    proposal: 0.5
  alpha_tSZ:
    prior: {min: -1.5, max: 0.5}
    ref: -0.46
    proposal: 0.1
  a_kSZ:
    prior: {min: 0, max: 10}
    ref: 0.99
    proposal: 0.3
  a_p:
    prior: {min: 0, max: 20}
    ref: 7.65
    proposal: 0.5
  beta_p:
    prior: {min: 1.0, max: 3.0}
    ref: 1.86
    proposal: 0.1
  a_c:
    prior: {min: 0, max: 20}
    ref: 3.81
    proposal: 0.5
  beta_c:
    prior: {min: 1.0, max: 3.0}
    ref: 1.86
    proposal: 0.1
  a_s:
    prior: {min: 0, max: 20}
    ref: 2.89
    proposal: 0.5
  beta_s:
    prior: {min: -4, max: 0}
    ref: -2.76
    proposal: 0.2
  a_gtt:
    prior: {min: 0, max: 20}
    ref: 7.97
    proposal: 0.5
  a_gte:
    prior: {min: 0, max: 5}
    ref: 0.42
    proposal: 0.1
  a_gee:
    prior: {min: 0, max: 2}
    ref: 0.17
    proposal: 0.05
  a_psee:
    prior: {min: 0, max: 0.1}
    ref: 0.0038
    proposal: 0.001
  a_pste:
    prior: {min: -0.1, max: 0.1}
    ref: -0.025
    proposal: 0.01
  xi:
    prior: {min: 0, max: 0.5}
    ref: 0.064
    proposal: 0.02
  alpha_s:
    value: 1.0
  T_effd:
    value: 19.6
  beta_d:
    value: 1.5
  alpha_dT:
    value: -0.6
  alpha_dE:
    value: -0.4
  alpha_p:
    value: 1.0
  T_d:
    value: 9.6

  # ACT Systematics parameters
  calG_all:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa4_f220:
    prior: {dist: norm, loc: 1.0, scale: 0.05}
    ref: 0.98
    proposal: 0.01
  cal_dr6_pa5_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa5_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa6_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa6_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa4_f220:
    value: 1.0
  calE_dr6_pa5_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.02}
    ref: 0.99
    proposal: 0.005
  calE_dr6_pa5_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.02}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa6_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.02}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa6_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.02}
    ref: 1.0
    proposal: 0.005
  bandint_shift_dr6_pa4_f220:
    prior: {dist: norm, loc: 0.0, scale: 3.6}
    ref: 6.4
    proposal: 1.0
  bandint_shift_dr6_pa5_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.0}
    ref: -0.29
    proposal: 0.3
  bandint_shift_dr6_pa5_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.3}
    ref: -1.06
    proposal: 0.4
  bandint_shift_dr6_pa6_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.2}
    ref: 0.31
    proposal: 0.3
  bandint_shift_dr6_pa6_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.1}
    ref: -0.43
    proposal: 0.3

  # Derived
  H0:
    latex: H_0
  sigma8:
    latex: \sigma_8

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.02
    burn_in: 50
    learn_proposal: true
    max_tries: 20000
    proposal_scale: 2.0

output: chains/phase2_act_lcdm
force: true
