# ΛCDM Baseline - Control Group for Ridder Comparison
# Pure Standard Model (no Ridder field, no coupling)

theory:
  classy:
    path: /home/ridderadmin/Ridder-Field/phase2/class
    extra_args:
      output: tCl, mPk, lCl
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      recombination: recfast
      non_linear: none

likelihood:
  # Planck 2018 Low-l (ESA high-l download is broken, using what works)
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null

params:
  # --- STANDARD COSMOLOGY ONLY ---
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.965
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 67.4
    proposal: 0.5
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.120
    proposal: 0.001
  tau_reio:
    prior: {min: 0.04, max: 0.08}
    ref: 0.054
    proposal: 0.004

sampler:
  mcmc:
    drag: true
    proposal_scale: 1.9
    covmat: auto
    Rminus1_stop: 0.05
    burn_in: 0
    max_samples: 5000

output: chains/lcdm_production
resume: false
debug: true

