# Tier 3 ΛCDM Baseline: Planck FULL + BAO + SH0ES
# Fresh output directory with covmat:auto to learn new proposal

theory:
  classy:
    extra_args:
      output: tCl, mPk
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      recombination: recfast
      non_linear: none

likelihood:
  # Planck 2018 FULL (Explicit .clik file loading)
  planck_lowl_TT:
    class: cobaya.likelihoods.clik
    path: /home/ridderadmin/.local/share/cobaya/data/planck_2018/baseline/plc_3.0/low_l/commander/commander_dx12_v3_2_29.clik
  
  planck_lowl_EE:
    class: cobaya.likelihoods.clik
    path: /home/ridderadmin/.local/share/cobaya/data/planck_2018/baseline/plc_3.0/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik
  
  planck_highl_TTTEEE:
    class: cobaya.likelihoods.clik
    path: /home/ridderadmin/.local/share/cobaya/data/planck_2018/baseline/plc_3.0/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
  
  planck_lensing:
    class: cobaya.likelihoods.clik
    path: /home/ridderadmin/.local/share/cobaya/data/planck_2018/baseline/plc_3.0/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing
  
  # BAO
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  
  # SH0ES H0 Constraint (Riess et al. 2022)
  sh0es_h0:
    external: |
      lambda _self=None, H0=None, **params_values: (
        -0.5 * ((H0 - 73.04) / 1.04)**2
      )
    requires:
      H0:
        latex: H_0

params:
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.965
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 70.3
    proposal: 0.5
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.120
    proposal: 0.001
  tau_reio:
    prior: {min: 0.04, max: 0.08}
    ref: 0.054
    proposal: 0.004
  A_planck:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.0025
  calib_100T:
    prior: {min: 0.997, max: 1.003}
    ref: 1.0002
    proposal: 0.0004
  calib_217T:
    prior: {min: 0.995, max: 1.005}
    ref: 0.99805
    proposal: 0.0006

sampler:
  mcmc:
    drag: true
    proposal_scale: 1.9
    covmat: auto
    max_samples: 5000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2

output: lcdm_tier3_prod_chain

