# Tier 5: CPL (w0waCDM) with SH0ES + DESI Y1 BAO (Local)
# Control: Does late-time DE flexibility help with tension + DESI?

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: 'yes'
      gauge: newtonian
      recombination: recfast
      use_ridder: 'no'
      Omega_fld: 0.7
      w0_fld: -1.0
      wa_fld: 0.0

likelihood:
  # CMB
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  
  # DESI Y1 BAO (custom likelihood)
  likelihoods.desi_y1_bao.DESI_Y1_BAO:
    python_path: /Users/steveridder/Git/Ridder-Field/phase3
  
  # SH0ES H0 prior
  sh0es_h0:
    external: 'lambda _self=None, H0=None, **p: -0.5 * ((H0 - 73.04) / 1.04)**2'
    requires:
      H0:
        latex: H_0

params:
  # Base cosmology
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 69.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.12
    proposal: 0.002
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    
  # CPL dark energy (k=8)
  w0_fld:
    prior: {min: -2.0, max: 0.0}
    ref: -1.0
    proposal: 0.05
    latex: w_0
  wa_fld:
    prior: {min: -2.0, max: 2.0}
    ref: 0.0
    proposal: 0.1
    latex: w_a
    
  # Derived
  rs_drag:
    latex: r_s
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_m:
    latex: \Omega_m
    derived: true
  S8:
    latex: S_8
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'

sampler:
  mcmc:
    max_samples: 2000
    Rminus1_stop: 0.03
    burn_in: 0
    learn_proposal: true
    drag: false
    proposal_scale: 2.4

output: chains/tier5_cpl_shoes_desi
debug: false
resume: false

