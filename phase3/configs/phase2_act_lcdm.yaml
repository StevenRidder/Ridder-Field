# Phase 2: ACT DR6 World - ΛCDM
# Testing: Does ΛCDM fit high-ℓ CMB damping tail?
# Likelihoods: Planck 2018 + Pre-DESI BAO + SH0ES + ACT DR6
# k = 6 parameters (base ΛCDM)

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 9000  # Higher for ACT
      lensing: true
      gauge: newtonian
      recombination: recfast
      non_linear: halofit
  # Foreground theory for ACT
  mflike.TheoryForge_MFLike:
    data_folder: ACTDR6MFLike/v1.0
    efficiencies_file: null
    spectra:
      polarizations: [TT, TE, EE]
      lmin: 2
      lmax: 9000
    systematics_template:
      has_calib: True
      has_calib_pol: True
      has_bandint_shift: True
    foregrounds:
      normalisation:
        nu_0: 150.0
        ell_0: 3000
        T_CMB: 2.725
      components:
        tt:
          - kSZ
          - tSZ
          - cibc
          - dust_tt
          - radio
        te: []
        ee:
          - dust_ee

likelihood:
  # Planck 2018 CMB (low-ℓ)
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  
  # ACT DR6 high-ℓ TT/TE/EE (the damping tail!)
  act_dr6_mflike.ACTDR6MFLike:
    stop_at_error: true
  
  # Pre-DESI BAO
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  
  # Pantheon+ Supernovae
  sn.pantheonplus:
  
  # SH0ES H0 prior
  shoes_h0:
    external: "lambda H0: -0.5*((H0 - 73.04)/1.04)**2"
    output_params: [chi2__shoes_h0]

params:
  # Base ΛCDM (k=6)
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 68.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.12
    proposal: 0.003
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # ACT foreground parameters
  # Bandpass shifts
  bandint_shift_dr6_pa4_f220:
    prior: {dist: norm, loc: 0.0, scale: 3.6}
    ref: 0.0
    proposal: 1.8
  bandint_shift_dr6_pa5_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.0}
    ref: 0.0
    proposal: 0.5
  bandint_shift_dr6_pa5_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.3}
    ref: 0.0
    proposal: 0.65
  bandint_shift_dr6_pa6_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.2}
    ref: 0.0
    proposal: 0.6
  bandint_shift_dr6_pa6_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.1}
    ref: 0.0
    proposal: 0.55
    
  # Temperature calibration
  cal_dr6_pa4_f220:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa5_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa5_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa6_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  cal_dr6_pa6_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
    
  # Polarization calibration
  calE_dr6_pa5_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa5_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa6_f090:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005
  calE_dr6_pa6_f150:
    prior: {dist: norm, loc: 1.0, scale: 0.01}
    ref: 1.0
    proposal: 0.005

  # Foreground amplitudes
  a_tSZ:
    prior: {min: 0, max: 20}
    ref: 3.3
    proposal: 0.5
  a_kSZ:
    prior: {min: 0, max: 10}
    ref: 1.0
    proposal: 0.3
  a_cibc:
    prior: {min: 0, max: 20}
    ref: 4.9
    proposal: 0.5
  a_dust_tt:
    prior: {min: 0, max: 50}
    ref: 5.0
    proposal: 1.0
  a_dust_ee:
    prior: {min: 0, max: 10}
    ref: 0.4
    proposal: 0.1
  a_radio:
    prior: {min: 0, max: 50}
    ref: 3.0
    proposal: 0.5

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s

sampler:
  mcmc:
    max_samples: 5000
    Rminus1_stop: 0.01
    burn_in: 50
    learn_proposal: true
    max_tries: 20000
    proposal_scale: 2.0

output: chains/phase2_act_lcdm
resume: true
