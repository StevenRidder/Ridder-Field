# Tier 6: ΛCDM + SH0ES World + ACT DR6
# PRODUCTION CONFIG - DO NOT MODIFY
# Likelihoods: Planck low-ℓ TT/EE, high-ℓ TTTEEE, ACT DR6, BAO, SN, SH0ES
# k = 6 parameters

theory:
  classy:
    # CRITICAL: Only send cosmological params to CLASS, NOT foregrounds!
    input_params: [A_s, n_s, H0, omega_b, omega_cdm, tau_reio]
    extra_args:
      # Output - NO COMMAS (space-separated only)
      output: tCl pCl lCl
      # ACT requires high ℓ_max for damping tail
      l_max_scalars: 8500
      lensing: yes
      gauge: newtonian
      N_ncdm: 0
      # CRITICAL: Disable hmcode - Ridder CLASS doesn't support it
      non_linear: none
      # Accuracy settings (Tier 10 level)
      # NOTE: CLASS doesn't accept CAMB parameter names like perturb_sampling_stepsize, tol_perturb_integration
      accurate_lensing: 1
      l_logstep: 1.035
      l_linstep: 25
      k_max_tau0_over_l_max: 2.5
      tol_background_integration: 1e-6
      tol_thermo_integration: 1e-6
  # ACT foreground theory
  mflike.BandpowerForeground:
    experiments:
      - dr6_pa4_f220
      - dr6_pa5_f090
      - dr6_pa5_f150
      - dr6_pa6_f090
      - dr6_pa6_f150
    bandint_freqs: [220, 90, 150, 90, 150]
    beam_profile:
      beam_from_file: null

likelihood:
  # CMB - NO LENSING (requests mPk which causes CLASS failures)
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  
  # ACT DR6 high-ℓ TT/TE/EE (damping tail)
  act_dr6_mflike.ACTDR6MFLike:
    stop_at_error: false
  
  # TEMPORARILY REMOVED: BAO/SN may request mPk causing CLASS failures
  # Will add back once chains are stable
  # bao.sixdf_2011_bao:
  # bao.sdss_dr7_mgs:
  # bao.sdss_dr12_consensus_bao:
  # sn.pantheonplus:
  
  # SH0ES H0 prior: 73.04 ± 1.04 km/s/Mpc
  shoes_h0:
    external: "lambda H0: -0.5*((H0 - 73.04)/1.04)**2"
    output_params: [chi2__shoes_h0]

params:
  # Base ΛCDM (k=6) - CLASS parameterization
  logA:
    prior: {min: 2.5, max: 3.7}
    ref: {dist: norm, loc: 3.05, scale: 0.02}
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.02}
    ref: {dist: norm, loc: 0.97, scale: 0.01}
    proposal: 0.002
    latex: n_s
  H0:
    prior: {min: 60.0, max: 80.0}
    ref: {dist: norm, loc: 69.0, scale: 2.0}
    proposal: 0.2
    latex: H_0
  omega_b:
    prior: {min: 0.020, max: 0.025}
    ref: {dist: norm, loc: 0.0224, scale: 0.0005}
    proposal: 5e-5
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: {dist: norm, loc: 0.120, scale: 0.005}
    proposal: 5e-4
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.03, max: 0.10}
    ref: {dist: norm, loc: 0.055, scale: 0.01}
    proposal: 0.005
    latex: \tau_{reio}

  # Planck nuisance parameters
  A_planck:
    prior: {dist: norm, loc: 1.0, scale: 0.0025}
    ref: 1.0
    proposal: 0.001
    latex: A_\mathrm{planck}
  calib_100T:
    prior: {dist: norm, loc: 1.0002, scale: 0.0007}
    ref: 1.0002
    proposal: 0.0003
  calib_217T:
    prior: {dist: norm, loc: 0.99805, scale: 0.00065}
    ref: 0.99805
    proposal: 0.0003

  # Planck foreground (plik defaults)
  A_cib_217:
    prior: {min: 0, max: 200}
    ref: 47
    proposal: 5
  xi_sz_cib:
    prior: {min: 0, max: 1}
    ref: 0.5
    proposal: 0.1
  A_sz:
    prior: {min: 0, max: 10}
    ref: 5
    proposal: 1
  ksz_norm:
    prior: {min: 0, max: 10}
    ref: 3
    proposal: 1
  gal545_A_100:
    prior: {min: 0, max: 50}
    ref: 8
    proposal: 2
  gal545_A_143:
    prior: {min: 0, max: 50}
    ref: 10
    proposal: 2
  gal545_A_143_217:
    prior: {min: 0, max: 100}
    ref: 20
    proposal: 4
  gal545_A_217:
    prior: {min: 0, max: 400}
    ref: 100
    proposal: 10
  ps_A_100_100:
    prior: {min: 0, max: 400}
    ref: 250
    proposal: 20
  ps_A_143_143:
    prior: {min: 0, max: 400}
    ref: 50
    proposal: 10
  ps_A_143_217:
    prior: {min: 0, max: 400}
    ref: 50
    proposal: 10
  ps_A_217_217:
    prior: {min: 0, max: 400}
    ref: 120
    proposal: 10
  galf_TE_A_100:
    prior: {min: 0, max: 1}
    ref: 0.1
    proposal: 0.05
  galf_TE_A_100_143:
    prior: {min: 0, max: 1}
    ref: 0.1
    proposal: 0.05
  galf_TE_A_100_217:
    prior: {min: 0, max: 1}
    ref: 0.4
    proposal: 0.1
  galf_TE_A_143:
    prior: {min: 0, max: 1}
    ref: 0.2
    proposal: 0.05
  galf_TE_A_143_217:
    prior: {min: 0, max: 1}
    ref: 0.6
    proposal: 0.1
  galf_TE_A_217:
    prior: {min: 0, max: 10}
    ref: 2
    proposal: 0.5

  # ACT calibration - tight priors around 1
  calG_all:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.01}
    proposal: 0.005
  cal_dr6_pa4_f220:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  cal_dr6_pa5_f090:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  cal_dr6_pa5_f150:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  cal_dr6_pa6_f090:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  cal_dr6_pa6_f150:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  calE_dr6_pa5_f090:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  calE_dr6_pa5_f150:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  calE_dr6_pa6_f090:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01
  calE_dr6_pa6_f150:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.02}
    proposal: 0.01

  # ACT foreground parameters
  bandint_shift_dr6_pa4_f220:
    prior: {dist: norm, loc: 0.0, scale: 3.6}
    ref: 0.0
    proposal: 1.8
  bandint_shift_dr6_pa5_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.0}
    ref: 0.0
    proposal: 0.5
  bandint_shift_dr6_pa5_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.3}
    ref: 0.0
    proposal: 0.65
  bandint_shift_dr6_pa6_f090:
    prior: {dist: norm, loc: 0.0, scale: 1.2}
    ref: 0.0
    proposal: 0.6
  bandint_shift_dr6_pa6_f150:
    prior: {dist: norm, loc: 0.0, scale: 1.1}
    ref: 0.0
    proposal: 0.55

  # NOTE: ACT foreground params (a_tSZ, a_kSZ, a_cibc, a_dust_tt, a_dust_ee, a_radio)
  # are handled internally by mflike.BandpowerForeground - do NOT define them here!

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s

sampler:
  mcmc:
    Rminus1_stop: 0.05  # Looser for faster initial convergence
    Rminus1_cl_stop: 0.1
    covmat: auto
    burn_in: 50
    max_tries: 1000  # Increased - CLASS fails for some param combos
    drag: true
    proposal_scale: 2.0
    learn_proposal: true
    learn_proposal_Rminus1_max: 5.0
    learn_proposal_Rminus1_min: 0.3
    # NOTE: Blocking removed - tier5 config that worked didn't use it

output: chains/tier6_lcdm_shoes_act
resume: true
