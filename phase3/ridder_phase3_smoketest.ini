# =============================================================================
# PHASE 3 SMOKE TEST - Minimal Validation Run
# =============================================================================
# Purpose: Fast 2-minute test to verify model viability at theta_i = 2.1
# Checks: r_s ≈ 139.1 Mpc, H(z_rec) bump ≈ 3-4%, damping tail ≈ 12%
# =============================================================================

# --- COSMOLOGICAL PARAMETERS (Standard Planck-like) ---
h = 0.72
omega_b = 0.02237
omega_cdm = 0.120
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.054

# --- SCALAR FIELD ACTIVATION ---
use_scf = yes
scf_tuning_index = 0
attractor_ic_scf = no
scf_parameters = 0.0, 0.0, 0.0, 0.0

# --- RIDDER FIELD PARAMETERS (Safe Mode @ theta_i = 2.1) ---
Lambda_EDE_ridder = 1.0
f_axion_ridder = 1.0e27
theta_i_ridder = 2.1         # Target value: below redline, avoids resonance
n_ridder = 3
beta_ridder = 0.01           # Small coupling for stability

# --- MINIMAL OUTPUT (Smoke Test Only) ---
output = tCl                 # CMB temperature spectrum only
modes = s                    # Scalar modes only
l_max_scalars = 3000         # Need high-ell for damping tail check
write_background = yes       # Required for r_s and H(z) checks

# --- PRECISION (Standard settings) ---
back_integration_stepsize = 5e-3
perturbations_integration_stepsize = 0.01
tol_background_integration = 1.e-4
tol_perturb_integration = 1.e-8

# --- OUTPUT FILES ---
root = output/ridder_phase3_smoketest_

# =============================================================================
# EXPECTED RESULTS:
# =============================================================================
# 1. Sound Horizon: r_s ≈ 139.1 Mpc (±0.3) in background file
# 2. Hubble Rate: H/H_LCDM ≈ 1.03-1.04 at z ≈ 1100
# 3. Damping Tail: C_ell ratio ≈ 1.10-1.15 at ell = 2000-3000
