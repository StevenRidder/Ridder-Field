# TIER 3: V3 BASELINE (no H0 prior)
# Full Planck TTTEEE + lensing + BAO
# f_eV is FREE - let data decide

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl
      l_max_scalars: 2508
      lensing: "yes"
      gauge: newtonian
      recombination: recfast
      
      use_ridder: "yes"
      ridder_model_type: v3_canon
      ridder_use_shelf: "yes"
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      ridder_use_tail: "no"
      ridder_f_eV: 2.0e26
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  # NO H0 prior

params:
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.92, max: 1.00}
    ref: 0.9649
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 68.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.1200
    proposal: 0.002
  tau_reio:
    prior: {min: 0.01, max: 0.10}
    ref: 0.0544
    proposal: 0.006

  # V3 EDE params (f_eV fixed at 2e26 in extra_args)
  ridder_Lambda_EDE_eV:
    prior: {min: 0.3, max: 0.8}
    ref: 0.5
    proposal: 0.05
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior: {min: 2.0e-4, max: 4.0e-4}
    ref: 3.0e-4
    proposal: 2.0e-5
    latex: a_c
  ridder_sigma_lna:
    prior: {min: 0.4, max: 1.0}
    ref: 0.6
    proposal: 0.1
    latex: \sigma_{\ln a}

  rs_drag:
    latex: r_s

sampler:
  mcmc:
    max_samples: 1500
    Rminus1_stop: 0.05
    burn_in: 0
    learn_proposal: false
    drag: false
    proposal_scale: 2.4

output: chains/tier3_v3_baseline
debug: false
resume: false

