# OPTIMIZED Tier 5: ΛCDM - Growth World (DES Y1)
# Changes vs original:
#   - Tighter integration tolerances
#   - Higher l_max for ACT compatibility
#   - More k-modes for BAO precision
#
# This is the baseline for Growth World Δχ² comparison

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      # OPTIMIZED: Higher l_max for ACT-range accuracy
      l_max_scalars: 3500
      lensing: true
      gauge: newtonian
      recombination: recfast
      non_linear: halofit  # Required for DES Y1
      
      # OPTIMIZED: Tighter integration tolerances
      tol_background_integration: 1e-4
      tol_perturb_integration: 1e-8
      
      # OPTIMIZED: More k-modes for smooth P(k) and BAO
      k_per_decade_for_pk: 20
      k_per_decade_for_bao: 200

likelihood:
  # CMB - Planck 2018
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  
  # Pre-DESI BAO
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  
  # Pantheon+ Supernovae
  sn.pantheonplus:
  
  # DES Y1 3x2pt (cosmic shear + galaxy clustering + galaxy-galaxy lensing)
  des_y1.joint:
  
  # SH0ES H0 prior
  shoes_h0:
    external: "lambda H0: -0.5*((H0 - 73.04)/1.04)**2"
    output_params: [chi2__shoes_h0]

params:
  # Base ΛCDM (k=6)
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 69.5
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.118
    proposal: 0.003
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.01
    burn_in: 100
    learn_proposal: true
    learn_proposal_Rminus1_max: 0.05
    max_tries: 20000
    proposal_scale: 2.0
    oversample_power: 0.3

output: chains/optimized_lcdm_growth
resume: true
