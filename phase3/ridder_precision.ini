# -----------------------------------------------------
# RIDDER FIELD – FULL PRECISION TEST
# Production-quality settings at optimal parameters
# Runtime: ~5-8 minutes
# -----------------------------------------------------

h = 0.72
omega_b = 0.02237
omega_cdm = 0.120
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.054

# -----------------------------------------------------
# Ridder Field Parameters (OPTIMAL CONFIGURATION)
# -----------------------------------------------------

use_scf = yes
scf_tuning_index = 0
attractor_ic_scf = no

# scf_parameters is ignored; routed to ridder potential
scf_parameters = 0.0, 0.0, 0.0, 0.0

Lambda_EDE_ridder = 1.0
f_axion_ridder = 1.0e27
theta_i_ridder = 2.1
n_ridder = 3
beta_ridder = 0.01

# -----------------------------------------------------
# PRODUCTION PRECISION
# -----------------------------------------------------

l_max_scalars = 3000         # Full CMB range
modes = s                    # Scalars only (for now)
output = tCl, mPk            # CMB + P(k)
gauge = newtonian

P_k_max_h/Mpc = 10.0         # Full P(k) range
k_per_decade_for_pk = 50     # High resolution

# Production tolerances
tol_background_integration = 1.e-4
tol_perturb_integration = 1.e-8

# -----------------------------------------------------
# Full Output Suite
# -----------------------------------------------------

write_background = yes
write_thermodynamics = yes
write_parameters = yes
write_primordial = no

# -----------------------------------------------------
# Lensing and Nonlinear
# -----------------------------------------------------

# Skip lensing for speed (not critical for damping tail test)
lensing = no

# Skip nonlinear for now (not needed for CMB)
nonlinear = no

# -----------------------------------------------------
# Output root
# -----------------------------------------------------

root = output/ridder_precision_

# -----------------------------------------------------
# End
# -----------------------------------------------------

