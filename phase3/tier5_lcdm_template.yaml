theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl
      l_max_scalars: 2508
      lensing: "yes"

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  H0_PRIOR_PLACEHOLDER

params:
  logA: {prior: {min: 2.5, max: 3.5}, ref: 3.044, proposal: 0.01, drop: true}
  A_s: {value: 'lambda logA: 1e-10*np.exp(logA)'}
  n_s: {prior: {min: 0.88, max: 1.02}, ref: 0.9649, proposal: 0.004}
  H0: {prior: {min: 60, max: 80}, ref: 67.5, proposal: 0.5}
  omega_b: {prior: {min: 0.018, max: 0.026}, ref: 0.02237, proposal: 0.0002}
  omega_cdm: {prior: {min: 0.08, max: 0.16}, ref: 0.1200, proposal: 0.002}
  tau_reio: {prior: {min: 0.01, max: 0.12}, ref: 0.0544, proposal: 0.006}
  rs_drag: {latex: r_s}

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.05
    burn_in: 100
    drag: false
    proposal_scale: 2.4

output: OUTPUT_PLACEHOLDER
debug: false
resume: false
