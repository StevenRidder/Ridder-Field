# Cobaya parameter file for Ridder Field model (RC-X*)
# Phase 3: MCMC Parameter Estimation
# Validated Configuration: Newtonian Gauge, Fluid-Only Perturbations, No P(k)

# ============================================================================
# THEORY: CLASS with Ridder field
# ============================================================================
theory:
  classy:
    path: "/Users/steveridder/Git/Ridder Field/phase2/class"
    extra_args:
      output: "tCl,pCl,lCl"  # NO mPk due to gauge artifact
      lensing: "yes"
      modes: "s"
      gauge: "newtonian"     # CRITICAL: Synchronous gauge causes crash
      l_max_scalars: 2500

# ============================================================================
# PARAMETERS
# ============================================================================
params:
  # Standard cosmological parameters
  # --------------------------------
  H0:
    prior:
      min: 60
      max: 80
    ref:
      dist: norm
      loc: 72.0
      scale: 2.0
    latex: H_0
  
  omega_b:
    prior:
      min: 0.020
      max: 0.025
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.0002
    latex: \omega_b
  
  omega_cdm:
    prior:
      min: 0.10
      max: 0.15
    ref:
      dist: norm
      loc: 0.1200
      scale: 0.002
    latex: \omega_{cdm}
  
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref:
      dist: norm
      loc: 3.044
      scale: 0.02
    latex: \log(10^{10}A_s)
  
  n_s:
    prior:
      min: 0.90
      max: 1.00  # Wider prior to accommodate damping tail effect from EDE
    ref:
      dist: norm
      loc: 0.9665
      scale: 0.006  # Slightly wider proposal for MCMC exploration
    latex: n_s
  
  tau_reio:
    prior:
      min: 0.01
      max: 0.10
    ref:
      dist: norm
      loc: 0.0561
      scale: 0.008
    latex: \tau_{reio}
  
  # Ridder field parameters (RC-X*)
  # -------------------------------
  Lambda_EDE_ridder:
    prior:
      min: 0.1
      max: 3.0
    ref:
      dist: norm
      loc: 1.0
      scale: 0.2
    latex: \Lambda_{\rm EDE} [eV]
  
  f_axion_ridder:
    value: 1.0e27
    latex: f [eV]
  
  theta_i_ridder:
    prior:
      min: 1.5
      max: 3.1
    ref:
      dist: norm
      loc: 2.5
      scale: 0.1
    latex: \theta_i
  
  beta_ridder:
    prior:
      min: 0.0
      max: 0.1
    ref:
      dist: norm
      loc: 0.01
      scale: 0.005
    latex: \beta
  
  n_ridder:
    value: 3
    latex: n

# ============================================================================
# LIKELIHOODS
# ============================================================================
likelihood:
  # Planck 2018 CMB
  planck_2018_highl_plik.TTTEEE: {}
  planck_2018_lowl.TT: {}
  planck_2018_lowl.EE: {}
  planck_2018_lensing.clik: {}
  
  # BAO (BOSS DR12)
  bao.boss_dr12: {}
  
  # SNe (Pantheon)
  sn.pantheon: {}
  
  # SH0ES H0 measurement (Optional - enable to test tension resolution)
  # H0.riess2020: {}

# ============================================================================
# SAMPLER
# ============================================================================
sampler:
  mcmc:
    max_tries: 10000
    Rminus1_stop: 0.05
    covmat: auto
    drag: true
    proposal_scale: 2.4

# ============================================================================
# OUTPUT
# ============================================================================
output: chains/ridder_field
debug: true
