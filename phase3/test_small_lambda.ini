# Test with smaller Lambda for stability
root = output/test_small_
write background = yes
gauge = newtonian

# Cosmological parameters
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
Omega_fld = 0.0

# Ridder Field - REDUCED Lambda for stability test
Lambda_EDE_ridder = 0.3
f_axion_ridder = 1e27
theta_i_ridder = 2.8
beta_ridder = 0.01
n_ridder = 3

# Primordial
A_s = 2.1e-9
n_s = 0.9665
tau_reio = 0.0561

# Output
output = tCl,pCl,lCl,mPk
lensing = yes
modes = s
l_max_scalars = 2500

