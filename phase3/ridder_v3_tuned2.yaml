# V3 TUNED v2: Sweet spot search
# f_eV = 3e26 (between 2e26 too weak, 5e26 too strong)

theory:
  classy:
    extra_args:
      output: tCl
      l_max_scalars: 2000
      lensing: "no"
      gauge: newtonian
      recombination: recfast
      
      use_ridder: "yes"
      ridder_model_type: v3_canon
      ridder_use_shelf: "yes"
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      ridder_use_tail: "no"
      
      # MIDDLE GROUND: f_eV = 3e26
      ridder_f_eV: 3.0e26
      
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TT: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null

params:
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.92, max: 1.00}
    ref: 0.9649
    proposal: 0.01
  
  H0:
    prior:
      dist: norm
      loc: 73.04
      scale: 1.04
    ref: 71.0
    proposal: 1.0
    latex: H_0
  
  omega_b:
    prior: {min: 0.020, max: 0.025}
    ref: 0.02237
    proposal: 0.0005
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.1200
    proposal: 0.003
  tau_reio:
    prior: {min: 0.01, max: 0.10}
    ref: 0.0544
    proposal: 0.008

  ridder_Lambda_EDE_eV:
    prior: {min: 0.3, max: 0.8}    # Tighter upper bound
    ref: 0.5
    proposal: 0.05
    latex: \Lambda_{EDE}
  
  ridder_a_c:
    prior: {min: 2.0e-4, max: 4.0e-4}   # Tighter around equality
    ref: 3.0e-4
    proposal: 2.0e-5
    latex: a_c
  
  ridder_sigma_lna:
    prior: {min: 0.4, max: 1.0}
    ref: 0.6
    proposal: 0.1
    latex: \sigma_{\ln a}

  rs_drag:
    latex: r_s

sampler:
  mcmc:
    max_samples: 500
    Rminus1_stop: 0.1
    burn_in: 0
    learn_proposal: false
    drag: false
    proposal_scale: 2.4

output: chains/v3_tuned2
debug: false
resume: false

