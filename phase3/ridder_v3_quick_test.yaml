# V3 Quick Test: Verify Cobaya + V3 CLASS integration
# Runtime: 2-4 hours
# Purpose: Smoke test before committing to long production runs

theory:
  classy:
    path: /home/ridderadmin/Ridder-Field/phase2/class
    extra_args:
      output: tCl, mPk
      l_max_scalars: 2508
      lensing: no  # Disable for speed
      gauge: newtonian
      recombination: recfast
      
      # V3 Ridder configuration
      use_ridder: yes
      ridder_model_type: v3_canon
      
      # EDE component - bump at origin, field starts displaced
      ridder_use_shelf: yes
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      
      # Tail component (TRGB branch, fixed for quick test)
      ridder_use_tail: yes
      ridder_Lambda_tail_eV: 0.0012  # 1.2 meV
      ridder_alpha_tail: 1.0
      ridder_theta_T_center: 0.0
      ridder_n_tail: 1.0
      
      # Floor (disabled in v3)
      ridder_Lambda_floor_eV: 0.0
      
      # Field normalization
      ridder_f_eV: 1.0e26
      
      # Initial conditions
      theta_i_ridder: 2.4
      ridder_c_slow: 0.0

likelihood:
  # Minimal likelihoods for quick test
  planck_2018_lowl.TT: null
  planck_2018_highl_plik.TTTEEE_lite: null

params:
  # --- Standard ΛCDM ---
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.001
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
    latex: A_s
  
  n_s:
    prior: {min: 0.92, max: 1.00}
    ref: 0.9649
    proposal: 0.003
    latex: n_s
  
  H0:
    prior: {min: 65, max: 75}
    ref: 69.5
    proposal: 0.4
    latex: H_0
  
  omega_b:
    prior: {min: 0.021, max: 0.024}
    ref: 0.02237
    proposal: 0.00015
    latex: \Omega_b h^2
  
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.1200
    proposal: 0.001
    latex: \Omega_c h^2
  
  tau_reio:
    prior: {min: 0.01, max: 0.10}
    ref: 0.0544
    proposal: 0.005
    latex: \tau_{reio}
  
  # --- V3 Ridder Parameters ---
  
  # EDE amplitude (controlled by shooting in production, here we vary directly)
  ridder_Lambda_EDE_eV:
    prior: {min: 0.05, max: 0.80}
    ref: 0.321
    proposal: 0.03
    latex: \Lambda_{EDE}
  
  # EDE peak redshift (via scale factor a_c = 1/(1+z_c))
  ridder_a_c:
    prior: {min: 2.5e-4, max: 8.0e-4}
    ref: 4.8e-4
    proposal: 4.0e-5
    latex: a_c
  
  # EDE width
  ridder_sigma_lna:
    prior: {min: 0.6, max: 1.8}
    ref: 1.0
    proposal: 0.08
    latex: \sigma_{\ln a}
  
  # --- Planck Nuisance (minimal set for lite likelihood) ---
  A_planck:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.002
    latex: y_{\rm cal}

sampler:
  mcmc:
    max_samples: 800
    Rminus1_stop: 0.15  # Loose convergence for quick test
    burn_in: 100
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9

output: chains/v3_quick_test
debug: false
resume: false

