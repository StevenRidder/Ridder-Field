theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: 'yes'
      gauge: newtonian
      use_ridder: 'yes'
      ridder_model_type: v3_canon
      ridder_use_shelf: 'yes'
      ridder_use_tail: 'no'
      ridder_f_eV: 2.0e26
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0
      ridder_sigma_E: 0.4
      beta_ridder: 0.08
      beta_z_c: 3000.0
      beta_sigma_z: 0.5
likelihood:
