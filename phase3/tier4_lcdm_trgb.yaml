theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: 'yes'
      gauge: newtonian
      recombination: recfast
      use_ridder: 'no'
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  trgb_h0:
    external: 'lambda _self=None, H0=None, **p: -0.5 * ((H0 - 69.8) / 1.7)**2'
    requires:
      H0:
        latex: H_0
params:
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior:
      min: 0.92
      max: 1.0
    ref: 0.9649
    proposal: 0.004
  H0:
    prior:
      min: 60
      max: 80
    ref: 68.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.12
    proposal: 0.002
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0544
    proposal: 0.006
  rs_drag:
    latex: r_s
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_m:
    latex: \Omega_m
    derived: true
  S8:
    latex: S_8
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'
sampler:
  mcmc:
    max_samples: 1500
    Rminus1_stop: 0.05
    burn_in: 0
    learn_proposal: false
    drag: false
    proposal_scale: 2.4
output: chains/tier4_lcdm_trgb
debug: false
resume: false
