###############################################
# Ridder Field – Phase 3 Smoke Test
# Fast run (< 1 minute)
###############################################

h = 0.72
omega_b = 0.02237
omega_cdm = 0.120
A_s = 2.1e-9
n_s = 0.9649
z_reio = 7.67

###############################################
# Core Ridder Field Configuration
###############################################

# Ridder Axion Parameters (no use_scf needed!)
Lambda_EDE_ridder = 1.0e3
f_axion_ridder = 1.0e27
theta_i_ridder = 2.1
n_ridder = 3
beta_ridder = 0.01

###############################################
# Output (keeps run fast)
###############################################

# Only compute TT up to ell=1500
output = tCl
l_max_scalars = 1500

# Skip lensing and mPk to keep runtime < 1 min
compute_lensing = no
P_k_max_h/Mpc = 0.3

# Write background + thermodynamics
write_background = yes
write_thermodynamics = yes

# Keep only 300 time steps for speed
background_verbose = 0
thermodynamics_verbose = 0
perturbations_verbose = 0

###############################################
# Precision (smoke-test shortcuts)
###############################################

# Reduce precision slightly to speed up run
tol_perturb_integration = 1e-6
k_step_sub = 0.02
k_step_super = 0.1
shooting_max = 20

###############################################
# Gauge
###############################################

gauge = newtonian
root = output/ridder_smoketest_

