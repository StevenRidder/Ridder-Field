# Ridder V2 Tier 4 Production: Planck + BAO + Pantheon SN
# Goal: 10,000 samples per chain for publication-quality constraints
# Expected runtime: ~10 hours per chain on US East VM

theory:
  classy:
    # Use system classy - no path needed
    extra_args:
      output: tCl, mPk, lCl
      l_max_scalars: 2508
      lensing: yes
      gauge: newtonian
      recombination: recfast
      non_linear: none
      
      # --- RIDDER V2 SETTINGS ---
      # Ridder field is enabled via Lambda_EDE_ridder > 0
      # No SCF settings needed

likelihood:
  # Planck 2018 FULL
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  
  # BAO (Baryon Acoustic Oscillations)
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  
  # Pantheon Supernovae (Type Ia SNe)
  sn.pantheon: null

params:
  # --- Standard LCDM ---
  logA:
    prior: {min: 2.0, max: 4.0}
    ref: 3.044
    proposal: 0.001
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: 'A_s'
  n_s:
    prior: {min: 0.9, max: 1.02}
    ref: 0.965
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 68.0  # Start at Planck value for Tier 4
    proposal: 0.5
  omega_b:
    prior: {min: 0.01, max: 0.03}
    ref: 0.0224
    proposal: 0.0001
  omega_cdm:
    prior: {min: 0.1, max: 0.14}
    ref: 0.120
    proposal: 0.001
  tau_reio:
    prior: {min: 0.04, max: 0.08}
    ref: 0.054
    proposal: 0.004

  # --- RIDDER V2 FIELD PARAMETERS ---
  
  # 1. Energy Scale (EDE amplitude)
  Lambda_EDE_ridder:
    prior: {min: 0.1, max: 2.0}
    ref: 0.6  # From smoke test
    proposal: 0.05
    latex: \Lambda_{EDE}

  # 2. Initial Misalignment Angle
  theta_i_ridder:
    prior: {min: 0.1, max: 3.0}
    ref: 2.17  # From smoke test
    proposal: 0.05
    latex: \theta_i

  # 3. DM Coupling Strength
  beta_ridder:
    prior: {min: 0.0, max: 0.1}
    ref: 0.035  # From smoke test
    proposal: 0.005
    latex: \beta

  # 4. Fixed Parameters
  f_axion_ridder:
    value: 1.0  # Decay constant in eV
  n_ridder:
    value: 3    # Potential power

  # --- Planck Nuisance Parameters ---
  A_planck:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.002
    latex: y_{\rm cal}
  
  # Calibration parameters
  calib_100T:
    prior: {min: 0.98, max: 1.02}
    ref: 0.9992
    proposal: 0.0004
  calib_217T:
    prior: {min: 0.98, max: 1.02}
    ref: 0.9985
    proposal: 0.0004
  A_pol:
    prior: {min: 0.9, max: 1.1}
    ref: 1.0
    proposal: 0.005
  calib_100P:
    value: 1.021
  calib_143P:
    value: 0.966
  calib_217P:
    value: 1.04
  
  # Foreground parameters (TT)
  cib_index:
    value: -1.3
  A_cib_217:
    prior: {min: 0, max: 200}
    ref: 67
    proposal: 6.5
  xi_sz_cib:
    prior: {min: 0, max: 1}
    ref: 0.1
    proposal: 0.1
  A_sz:
    prior: {min: 0, max: 10}
    ref: 7.0
    proposal: 2.0
  ksz_norm:
    prior: {min: 0, max: 10}
    ref: 0.0
    proposal: 2.5
  gal545_A_100:
    prior: {min: 0, max: 50}
    ref: 7.0
    proposal: 2.0
  gal545_A_143:
    prior: {min: 0, max: 50}
    ref: 9.0
    proposal: 2.0
  gal545_A_143_217:
    prior: {min: 0, max: 100}
    ref: 21.0
    proposal: 8.5
  gal545_A_217:
    prior: {min: 0, max: 400}
    ref: 80.0
    proposal: 20.0
  A_sbpx_100_100_TT:
    value: 1.0
  A_sbpx_143_143_TT:
    value: 1.0
  A_sbpx_143_217_TT:
    value: 1.0
  A_sbpx_217_217_TT:
    value: 1.0
  ps_A_100_100:
    prior: {min: 0, max: 400}
    ref: 257.0
    proposal: 30.0
  ps_A_143_143:
    prior: {min: 0, max: 400}
    ref: 47.0
    proposal: 10.0
  ps_A_143_217:
    prior: {min: 0, max: 400}
    ref: 40.0
    proposal: 12.0
  ps_A_217_217:
    prior: {min: 0, max: 400}
    ref: 104.0
    proposal: 13.0
  
  # Foreground parameters (TE)
  galf_TE_index:
    value: -2.4
  galf_TE_A_100:
    prior: {min: 0, max: 10}
    ref: 0.13
    proposal: 0.042
  galf_TE_A_100_143:
    prior: {min: 0, max: 10}
    ref: 0.13
    proposal: 0.036
  galf_TE_A_100_217:
    prior: {min: 0, max: 10}
    ref: 0.46
    proposal: 0.09
  galf_TE_A_143:
    prior: {min: 0, max: 10}
    ref: 0.207
    proposal: 0.072
  galf_TE_A_143_217:
    prior: {min: 0, max: 10}
    ref: 0.69
    proposal: 0.09
  galf_TE_A_217:
    prior: {min: 0, max: 10}
    ref: 1.938
    proposal: 0.54
  
  # Foreground parameters (EE)
  galf_EE_index:
    value: -2.4
  galf_EE_A_100:
    value: 0.055
  galf_EE_A_100_143:
    value: 0.04
  galf_EE_A_100_217:
    value: 0.094
  galf_EE_A_143:
    value: 0.086
  galf_EE_A_143_217:
    value: 0.21
  galf_EE_A_217:
    value: 0.7
  A_cnoise_e2e_100_100_EE:
    value: 1.0
  A_cnoise_e2e_143_143_EE:
    value: 1.0
  A_cnoise_e2e_217_217_EE:
    value: 1.0
  A_sbpx_100_100_EE:
    value: 1.0
  A_sbpx_100_143_EE:
    value: 1.0
  A_sbpx_100_217_EE:
    value: 1.0
  A_sbpx_143_143_EE:
    value: 1.0
  A_sbpx_143_217_EE:
    value: 1.0
  A_sbpx_217_217_EE:
    value: 1.0
  
  # --- Pantheon Nuisance Parameter ---
  M:
    prior: {min: -20, max: -18}
    ref: -19.3
    proposal: 0.004
    latex: M

sampler:
  mcmc:
    max_samples: 10000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    measure_speeds: true
    oversample_power: 0.4
    drag: true

output: chains/ridder_v2_tier4_prod
debug: false

