theory:
  classy:
    extra_args:
      output: tCl,pCl,lCl,mPk
      l_max_scalars: 2508
      lensing: 'yes'
      gauge: newtonian
      recombination: recfast
      P_k_max_1/Mpc: 1.0
      z_pk: 0.0, 0.5, 1.0
      use_ridder: 'yes'
      ridder_model_type: v3_canon
      ridder_use_shelf: 'yes'
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      ridder_use_tail: 'no'
      ridder_f_eV: 2.0e+26
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
  des_y1.shear: null
  sh0es_h0:
    external: 'lambda _self=None, H0=None, **p: -0.5 * ((H0 - 73.04) / 1.04)**2'
    requires:
      H0:
        latex: H_0
params:
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior:
      min: 0.92
      max: 1.0
    ref: 0.9649
    proposal: 0.004
  H0:
    prior:
      min: 60
      max: 80
    ref: 71.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.12
    proposal: 0.002
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0544
    proposal: 0.006
  ridder_Lambda_EDE_eV:
    prior:
      min: 0.3
      max: 0.8
    ref: 0.43
    proposal: 0.05
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior:
      min: 0.0002
      max: 0.0004
    ref: 0.00031
    proposal: 2.0e-05
    latex: a_c
  ridder_sigma_lna:
    prior:
      min: 0.4
      max: 1.0
    ref: 0.62
    proposal: 0.1
    latex: \sigma_{\ln a}
  sigma8:
    latex: \sigma_8
  Omega_m:
    latex: \Omega_m
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'
    latex: S_8
  rs_drag:
    latex: r_s
sampler:
  mcmc:
    max_samples: 1000
    Rminus1_stop: 0.05
    burn_in: 0
    drag: false
    max_tries: 10000
output: tier4L_v3_shoes
