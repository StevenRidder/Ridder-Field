theory:
  classy:
    extra_args:
      output: tCl pCl lCl
      l_max_scalars: 8500
      lensing: true
      gauge: newtonian
      N_ncdm: 0
      non_linear: none
      accurate_lensing: 1
      tol_background_integration: 1.0e-05
      tol_thermo_integration: 1.0e-05
      Lambda_EDE_ridder: 0.79
      f_axion_ridder: 1.0e+27
      theta_i_ridder: 1.0
      beta_ridder: 0.0
      n_ridder: 3
    input_params:
    - A_s
    - n_s
    - H0
    - omega_b
    - omega_cdm
    - tau_reio
  mflike.BandpowerForeground:
    experiments:
    - dr6_pa4_f220
    - dr6_pa5_f090
    - dr6_pa5_f150
    - dr6_pa6_f090
    - dr6_pa6_f150
    bandint_freqs:
    - 220
    - 90
    - 150
    - 90
    - 150
    beam_profile:
      beam_from_file: null
likelihood:
