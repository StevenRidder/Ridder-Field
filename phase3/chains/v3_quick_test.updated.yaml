theory:
  classy:
    path: /home/<VM_USER>/Ridder-Field/phase2/class
    speed: 0.2
    stop_at_error: false
    extra_args:
      output: tCl, mPk
      l_max_scalars: 2508
      lensing: false
      gauge: newtonian
      recombination: recfast
      use_ridder: 'yes'
      ridder_model_type: v3_canon
      ridder_use_shelf: 'yes'
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      ridder_use_tail: 'yes'
      ridder_Lambda_tail_eV: 0.0012
      ridder_alpha_tail: 1.0
      ridder_theta_T_center: 0.0
      ridder_n_tail: 1.0
      ridder_Lambda_floor_eV: 0.0
      ridder_f_eV: 1.0e+26
      theta_i_ridder: 2.4
      ridder_c_slow: 0.0
    ignore_obsolete: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
    version: v3.3.3
    input_params:
    - A_s
    - n_s
    - H0
    - omega_b
    - omega_cdm
    - tau_reio
    - ridder_Lambda_EDE_eV
    - ridder_a_c
    - ridder_sigma_lna
    output_params: []
likelihood:
  planck_2018_lowl.TT:
    lmin: 2
    lmax: 29
    type: CMB
    aliases:
    - lowT
    speed: -1
    stop_at_error: false
    version: null
    input_params:
    - A_planck
    output_params: []
  planck_2018_highl_plik.TTTEEE_lite:
    path: null
    clik_file: baseline/plc_3.0/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
    product_id: '151902'
    commands: null
    aliases:
    - plikHM_TTTEEE
    speed: 500
    type: CMB
    stop_at_error: false
    version: null
    input_params:
    - A_planck
    output_params: []
params:
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.001
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*__import__("numpy").exp(logA)'
    latex: A_s
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.92
      max: 1.0
    ref: 0.9649
    proposal: 0.003
    latex: n_s
    renames:
    - ns
  H0:
    prior:
      min: 65
      max: 75
    ref: 69.5
    proposal: 0.4
    latex: H_0
  omega_b:
    prior:
      min: 0.021
      max: 0.024
    ref: 0.02237
    proposal: 0.00015
    latex: \Omega_b h^2
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.12
    proposal: 0.001
    latex: \Omega_c h^2
    renames:
    - omegach2
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0544
    proposal: 0.005
    latex: \tau_{reio}
    renames:
    - tau
  ridder_Lambda_EDE_eV:
    prior:
      min: 0.05
      max: 0.8
    ref: 0.321
    proposal: 0.03
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior:
      min: 0.00025
      max: 0.0008
    ref: 0.00048
    proposal: 4.0e-05
    latex: a_c
  ridder_sigma_lna:
    prior:
      min: 0.6
      max: 1.8
    ref: 1.0
    proposal: 0.08
    latex: \sigma_{\ln a}
  A_planck:
    prior:
      min: 0.9
      max: 1.1
    ref: 1.0
    proposal: 0.002
    latex: y_{\rm cal}
    renames: calPlanck
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 100
    max_tries: 40d
    covmat: null
    covmat_params: null
    proposal_scale: 1.9
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: 800
    Rminus1_stop: 0.15
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: true
    blocking:
    - - 1
      - - logA
        - n_s
        - H0
        - omega_b
        - omega_cdm
        - tau_reio
        - ridder_Lambda_EDE_eV
        - ridder_a_c
        - ridder_sigma_lna
    - - 18
      - - A_planck
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: '3.6'
output: v3_quick_test
version: '3.6'
