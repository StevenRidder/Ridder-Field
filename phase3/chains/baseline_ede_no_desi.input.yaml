theory:
  classy:
    extra_args:
      output: tCl, mPk
      l_max_scalars: 2508
      lensing: true
      gauge: newtonian
      recombination: recfast
      non_linear: none
      Lambda_EDE_ridder: 1.0
      f_axion_ridder: 1.0e+27
      n_ridder: 3
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null
params:
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior:
      min: 0.92
      max: 1.0
    ref: 0.9649
    proposal: 0.004
  H0:
    prior:
      min: 60
      max: 80
    ref: 70.0
    proposal: 0.3
    latex: H_0
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.118
    proposal: 0.002
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0544
    proposal: 0.006
  theta_i_ridder:
    prior:
      min: 1.4
      max: 1.9
    ref: 1.58
    proposal: 0.02
    latex: \theta_i
  beta_ridder:
    prior:
      min: 0.0
      max: 0.01
    ref: 0.002
    proposal: 0.001
    latex: \beta
  rs_drag:
    latex: r_s
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_m:
    latex: \Omega_m
    derived: true
  S8:
    latex: S_8
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'
sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.02
    burn_in: 100
    learn_proposal: true
    max_tries: 10000
    proposal_scale: 2.4
output: baseline_ede_no_desi
