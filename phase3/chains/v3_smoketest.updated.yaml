theory:
  classy:
    path: null
    speed: 0.2
    stop_at_error: false
    extra_args:
      output: tCl
      l_max_scalars: 500
      lensing: 'no'
      gauge: newtonian
      recombination: recfast
      use_ridder: 'yes'
      ridder_model_type: v3_canon
      ridder_use_shelf: 'yes'
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      ridder_use_tail: 'no'
      ridder_f_eV: 5.0e+26
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0
    ignore_obsolete: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
    version: v3.3.3
    input_params:
    - A_s
    - n_s
    - H0
    - omega_b
    - omega_cdm
    - tau_reio
    - ridder_Lambda_EDE_eV
    - ridder_a_c
    - ridder_sigma_lna
    output_params:
    - rs_drag
likelihood:
  planck_2018_lowl.TT:
    lmin: 2
    lmax: 29
    type: CMB
    aliases:
    - lowT
    speed: -1
    stop_at_error: false
    version: null
    input_params: []
    output_params: []
params:
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.01
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.92
      max: 1.0
    ref: 0.9649
    proposal: 0.01
    latex: n_s
    renames:
    - ns
  H0:
    prior:
      dist: norm
      loc: 73.04
      scale: 1.04
    ref: 72.0
    proposal: 2.0
    latex: H_0
  omega_b:
    prior:
      min: 0.02
      max: 0.025
    ref: 0.02237
    proposal: 0.001
    latex: \Omega_b h^2
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.12
    proposal: 0.005
    latex: \Omega_c h^2
    renames:
    - omegach2
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0544
    proposal: 0.01
    latex: \tau_{reio}
    renames:
    - tau
  ridder_Lambda_EDE_eV:
    prior:
      min: 0.1
      max: 1.0
    ref: 0.5
    proposal: 0.1
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior:
      min: 0.0001
      max: 0.001
    ref: 0.0003
    proposal: 0.0001
    latex: a_c
  ridder_sigma_lna:
    prior:
      min: 0.5
      max: 2.0
    ref: 1.0
    proposal: 0.2
    latex: \sigma_{\ln a}
  rs_drag:
    latex: r_s
    derived: true
    renames:
    - rdrag
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 100
    max_tries: 40d
    covmat: null
    covmat_params: null
    proposal_scale: 2.0
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: 2000
    Rminus1_stop: 0.1
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: false
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - logA
        - n_s
        - H0
        - omega_b
        - omega_cdm
        - tau_reio
        - ridder_Lambda_EDE_eV
        - ridder_a_c
        - ridder_sigma_lna
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: '3.6'
output: v3_smoketest
version: '3.6'
