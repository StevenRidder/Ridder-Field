      min: 60
      max: 80
    ref: 71.0
    proposal: 0.5
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref: 0.12
    proposal: 0.002
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.0544
    proposal: 0.006
  ridder_Lambda_EDE_eV:
    prior:
      min: 0.3
      max: 0.8
    ref: 0.5
    proposal: 0.05
  ridder_a_c:
    prior:
      min: 0.0002
      max: 0.0004
    ref: 0.0003
    proposal: 2.0e-05
  ridder_sigma_lna:
    prior:
      min: 0.4
      max: 1.0
    ref: 0.6
    proposal: 0.1
  beta_ridder:
    prior:
      min: 0.0
      max: 0.3
    ref: 0.15
    proposal: 0.02
  rs_drag:
    latex: r_s
