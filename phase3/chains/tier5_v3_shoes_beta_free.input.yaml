theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl
      l_max_scalars: 2508
      lensing: 'yes'
      gauge: newtonian
      recombination: recfast
      use_ridder: 'yes'
      ridder_model_type: v3_canon
      ridder_use_shelf: 'yes'
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      ridder_use_tail: 'no'
      ridder_f_eV: 2.0e+26
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0
      beta_z_c: 3000.0
      beta_sigma_z: 0.5
likelihood:
