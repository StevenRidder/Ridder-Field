# -----------------------------------------------------
# RIDDER FIELD – 2 MINUTE SMOKE TEST
# Fastest possible CLASS run with full field + coupling
# -----------------------------------------------------

h = 0.72
omega_b = 0.02237
omega_cdm = 0.120
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.054

# -----------------------------------------------------
# Ridder Field Parameters (SAFE ZONE)
# -----------------------------------------------------

use_scf = yes
scf_tuning_index = 0
attractor_ic_scf = no

# scf_parameters is ignored; routed to ridder potential
scf_parameters = 0.0, 0.0, 0.0, 0.0

Lambda_EDE_ridder = 1.0
f_axion_ridder = 1.0e27
theta_i_ridder = 2.1
n_ridder = 3
beta_ridder = 0.01

# -----------------------------------------------------
# Super-Fast Precision Block
# -----------------------------------------------------

l_max_scalars = 1800         # fastest safe choice
modes = s                    # only scalars
output = tCl, mPk            # CMB + P(k)
gauge = newtonian

P_k_max_h/Mpc = 1.0
k_per_decade_for_pk = 30     # faster

tol_background_integration = 1e-4
tol_perturb_integration = 1e-6

# -----------------------------------------------------
# Outputs you need for H0 + r_s + w(z)
# -----------------------------------------------------

write_background = yes
write_parameters = yes
write_primordial = no
write_wk = no

# -----------------------------------------------------
# Speed hacks
# -----------------------------------------------------

halofit = no                 # skip nonlinear corrections
nonlinear = no               # skip expensive modules
do_lensing = no              # skip lensing to save time

# -----------------------------------------------------
# Output root
# -----------------------------------------------------

root = output/ridder_smoketest2_

# -----------------------------------------------------
# End
# -----------------------------------------------------
