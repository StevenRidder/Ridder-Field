# V3 PLANCK-LITE TEST
# Stage 2: Low-ℓ TT + EE + SH0ES (faster than full Planck)
# Only move to full Planck once this passes

theory:
  classy:
    extra_args:
      output: tCl
      l_max_scalars: 1500     # Reduced from 2508 for speed
      lensing: "no"           # Off for speed
      gauge: newtonian
      recombination: recfast
      
      # V3 Ridder configuration
      use_ridder: "yes"
      ridder_model_type: v3_canon
      
      # EDE component
      ridder_use_shelf: "yes"
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      
      # Tail OFF for now
      ridder_use_tail: "no"
      
      # f_eV = 5e26 (validated to give ~3.5% rs reduction)
      ridder_f_eV: 5.0e26
      
      # Initial conditions
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0

likelihood:
  # Planck-lite: Low-ℓ only (faster than full TTTEEE)
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  # BAO for distance ladder
  bao.sixdf_2011_bao: null
  bao.sdss_dr7_mgs: null
  bao.sdss_dr12_consensus_bao: null

params:
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.00}
    ref: 0.9649
    proposal: 0.01
    latex: n_s
  
  # H0 with SH0ES prior
  H0:
    prior:
      dist: norm
      loc: 73.04
      scale: 1.04
    ref: 72.0
    proposal: 1.5
    latex: H_0
  
  omega_b:
    prior: {min: 0.020, max: 0.025}
    ref: 0.02237
    proposal: 0.0005
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.1200
    proposal: 0.003
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.10}
    ref: 0.0544
    proposal: 0.008
    latex: \tau_{reio}

  # V3 Ridder Parameters
  ridder_Lambda_EDE_eV:
    prior: {min: 0.3, max: 1.0}
    ref: 0.7
    proposal: 0.1
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior: {min: 1.0e-4, max: 2.0e-3}
    ref: 5.0e-4
    proposal: 2.0e-4
    latex: a_c
  ridder_sigma_lna:
    prior: {min: 0.3, max: 1.5}
    ref: 0.8
    proposal: 0.2
    latex: \sigma_{\ln a}

  # Derived parameters
  rs_drag:
    latex: r_s

sampler:
  mcmc:
    max_samples: 3000
    Rminus1_stop: 0.1
    burn_in: 200
    drag: false
    measure_speeds: false
    proposal_scale: 2.0

output: chains/v3_planck_lite
debug: false
resume: false

