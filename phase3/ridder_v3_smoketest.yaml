# V3 SMOKE TEST: Just SH0ES prior - NO Planck, NO BAO
# Purpose: Debug V3 physics quickly before adding expensive likelihoods
# Each step should take < 1 second

theory:
  classy:
    extra_args:
      output: tCl
      l_max_scalars: 500     # Minimal - just need background
      lensing: "no"          # Off for speed
      gauge: newtonian
      recombination: recfast
      
      # V3 Ridder configuration
      use_ridder: "yes"
      ridder_model_type: v3_canon
      
      # EDE component
      ridder_use_shelf: "yes"
      ridder_theta_E_center: 0.0
      ridder_sigma_E: 0.4
      ridder_n_EDE: 3.0
      
      # Tail OFF for smoke test - just test EDE
      ridder_use_tail: "no"
      
      # FIXED f_eV = 5e26 (the key fix!)
      ridder_f_eV: 5.0e26
      
      # Initial conditions
      theta_i_ridder: 2.8
      ridder_c_slow: 0.0

likelihood:
  # Use simplest Planck likelihood (low-ell TT only) to force CLASS to run
  # This is fast but still requires actual CMB calculation
  planck_2018_lowl.TT: null

params:
  # Minimal ΛCDM params
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
    latex: \log(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.00}
    ref: 0.9649
    proposal: 0.01
    latex: n_s
  
  # H0 - with SH0ES prior directly in params
  H0:
    prior:
      dist: norm
      loc: 73.04
      scale: 1.04
    ref: 72.0
    proposal: 2.0
    latex: H_0
  
  omega_b:
    prior: {min: 0.020, max: 0.025}
    ref: 0.02237
    proposal: 0.001
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.1200
    proposal: 0.005
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.10}
    ref: 0.0544
    proposal: 0.01
    latex: \tau_{reio}

  # V3 Ridder Parameters - wider priors for exploration
  ridder_Lambda_EDE_eV:
    prior: {min: 0.1, max: 1.0}
    ref: 0.5
    proposal: 0.1
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior: {min: 1.0e-4, max: 1.0e-3}
    ref: 3.0e-4
    proposal: 1.0e-4
    latex: a_c
  ridder_sigma_lna:
    prior: {min: 0.5, max: 2.0}
    ref: 1.0
    proposal: 0.2
    latex: \sigma_{\ln a}

  # Derived parameters from CLASS (forces CLASS to run)
  rs_drag:
    latex: r_s

sampler:
  mcmc:
    max_samples: 2000
    Rminus1_stop: 0.1
    burn_in: 100
    drag: false
    measure_speeds: false
    proposal_scale: 2.0

output: chains/v3_smoketest
debug: false
resume: false

