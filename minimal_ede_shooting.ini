# MINIMAL EDE SHOOTING TEST
# 
# Purpose: Get shooting mechanism working in simplest possible model
# No tail, no coupling, no plateau - pure axion EDE with calibration
#
# Success criteria:
#   1. Shooting converges to find m_axion
#   2. f_EDE(z_c) ~ target within tolerance
#   3. Background evolution stable
#   4. Field actually rolls (not frozen, not exploding)

# ============================================================================
# Standard ΛCDM baseline
# ============================================================================
H0 = 67.36
omega_b = 0.02238280
omega_cdm = 0.1201075
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842
YHe = 0.2454

gauge = newtonian

# ============================================================================
# Ridder field: MINIMAL AXION EDE ONLY
# ============================================================================
use_ridder = yes
ridder_model_type = unified

# Global field scale (for phi -> theta conversion)
ridder_f = 2.435e25  # M_Pl in eV

# Component toggles: SHELF ONLY
ridder_use_tail = no      # Late-time DE: OFF
ridder_use_shelf = yes    # EDE bump: ON
ridder_use_plateau = no   # Inflation: OFF

# ============================================================================
# Shooting mechanism: CALIBRATE m_axion for target f_EDE
# ============================================================================
ridder_use_shooting_EDE = yes
ridder_f_EDE_target = 0.10           # Target: 10% EDE fraction
ridder_z_c_target = 3000.0           # Target: peak at z ~ 3000

# Shooting bracket (in H0 units)
# Further narrowed: m=100 H0 still too strong (f_ridder=36% at early times)
ridder_shooting_m_min = 1.0          # Small mass
ridder_shooting_m_max = 1.0e2        # Moderate mass
ridder_shooting_tolerance = 1.0e-3   # 0.1% tolerance on f_EDE
ridder_shooting_max_iterations = 30

# ============================================================================
# Shelf (EDE) parameters
# ============================================================================
# m_axion will be SET BY SHOOTING - placeholder value here
ridder_m_axion = 0.0  # Will be calibrated by shooting

# Decay constant: START with intermediate value
ridder_f_axion = 0.01  # 0.01 M_Pl ~ 10^-2 * 2.4e18 GeV

# Potential shape
ridder_n_EDE = 3.0

# Shelf window: WIDE to allow field to enter
# We'll refine this after seeing where field goes
ridder_theta_EDE_low = 0.01
ridder_theta_EDE_high = 10.0
ridder_sigma_theta_EDE = 0.5

# Initial conditions: Start at intermediate theta
ridder_theta_i = 2.8  # Standard axion EDE value from literature

# ============================================================================
# CDM coupling: OFF for minimal test
# ============================================================================
beta_ridder = 0.0
ridder_beta_sigma_z = 0.0
ridder_beta_zc = 0.0

# ============================================================================
# Evolution controls
# ============================================================================
ridder_c_slow = 1.0
ridder_force_damping = 1.0
ridder_freeze_phi = no

# ============================================================================
# Outputs: BACKGROUND ONLY for now
# ============================================================================
output = tCl
write background = yes
background_verbose = 2
write parameters = yes
root = output/minimal_ede_shooting_

# Precision: standard for background
tol_background_integration = 1e-6

