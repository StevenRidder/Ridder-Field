theory:
  classy:
    extra_args:
      output: tCl pCl lCl
      l_max_scalars: 9000
      lensing: true
      gauge: newtonian
      non_linear: halofit
    input_params: [A_s, n_s, H0, omega_b, omega_cdm, tau_reio]
  mflike.BandpowerForeground:
    experiments: [dr6_pa4_f220, dr6_pa5_f090, dr6_pa5_f150, dr6_pa6_f090, dr6_pa6_f150]
    bandint_freqs: [220, 90, 150, 90, 150]

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  act_dr6_mflike.ACTDR6MFLike:
    stop_at_error: false

params:
  # Cosmological params for classy
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
  H0:
    prior: {min: 60, max: 80}
    ref: 68.0
    proposal: 0.5
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.12
    proposal: 0.003
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006

  # ACT calibration/foreground params for mflike
  bandint_shift_dr6_pa4_f220: 0.0
  bandint_shift_dr6_pa5_f090: 0.0
  bandint_shift_dr6_pa5_f150: 0.0
  bandint_shift_dr6_pa6_f090: 0.0
  bandint_shift_dr6_pa6_f150: 0.0
  cal_dr6_pa4_f220: 1.0
  cal_dr6_pa5_f090: 1.0
  cal_dr6_pa5_f150: 1.0
  cal_dr6_pa6_f090: 1.0
  cal_dr6_pa6_f150: 1.0
  calE_dr6_pa4_f220: 1.0
  calE_dr6_pa5_f090: 1.0
  calE_dr6_pa5_f150: 1.0
  calE_dr6_pa6_f090: 1.0
  calE_dr6_pa6_f150: 1.0
  calG_all: 1.0
  a_tSZ: 3.3
  a_kSZ: 1.0
  a_p: 6.9
  beta_p: 2.08
  a_c: 4.9
  beta_c: 2.20
  a_s: 3.1
  a_gtt: 1.5
  a_gte: 0.0
  a_gee: 0.1
  a_psee: 0.1
  a_pste: 0.0
  xi: 0.2
  alpha_s: -0.6
  beta_s: -2.5
  alpha_p: 1.0
  T_d: 9.7
  alpha_dT: 0.0
  alpha_dE: -0.4
  T_effd: 19.6
  beta_d: 1.5
  alpha_tSZ: 0.0
  # NOTE: Removed a_cibc, a_dust_tt, a_dust_ee, a_radio - let Planck use defaults

sampler:
  mcmc:
    max_samples: 10
    max_tries: 1000

output: chains/act_planck_v5
