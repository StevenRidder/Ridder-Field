# Tier 5 Phase 2: ΛCDM with ACT DR4
# Tests: High-ℓ CMB consistency with damping tail
# k = 6 parameters

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 5000
      lensing: "yes"
      non_linear: hmcode

likelihood:
  # Planck low-ℓ
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  
  # Planck high-ℓ (for overlap region)
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  
  # ACT DR4 (pyactlike)
  pyactlike.ACTPol_lite_DR4:
  
  # BAO
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  
  # SH0ES for H0 anchor
  sh0es_h0:
    external: "lambda _self=None, H0=None, **p: -0.5 * ((H0 - 73.04) / 1.04)**2"
    requires:
      H0:
        latex: H_0

params:
  # Base ΛCDM (k=6)
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 68.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.10, max: 0.14}
    ref: 0.120
    proposal: 0.002
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # Derived
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rdrag:
    latex: r_s

sampler:
  mcmc:
    max_samples: 5000
    Rminus1_stop: 0.02
    burn_in: 50
    learn_proposal: true

output: chains/tier5_lcdm_act
resume: true
