# Paper 2 Run C: EDE with TIER5 params + Planck High-L (control)
# This is the baseline with full Planck

packages_path: /home/azureuser/packages

theory:
  classy:
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 2508
      lensing: "yes"
      gauge: newtonian
      recombination: recfast
      non_linear: none
      # TIER5 EDE PARAMETERS
      use_ridder: "yes"
      n_ridder: 3
      theta_i_ridder: 1.0
      beta_ridder: 0.0
      f_axion_ridder: 1.0e+27

likelihood:
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:  # WITH High-L for control
  planck_2018_lensing.clik:
  
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  likelihoods.desi_y1_bao.DESI_Y1_BAO:
    python_path: /home/azureuser/Ridder-Field/phase4
  
  sn.pantheonplus:

params:
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.92, max: 1.0}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 70.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.12
    proposal: 0.002
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.1}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # TIER5 EDE AMPLITUDE - SAMPLED
  Lambda_EDE_ridder:
    prior: {min: 0.1, max: 3.0}
    ref: 1.0
    proposal: 0.2
    latex: \Lambda_{EDE}

  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s

sampler:
  mcmc:
    max_samples: 50000
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.1
    burn_in: 100
    learn_proposal: true
    max_tries: 20000
    proposal_scale: 2.0
    drag: true

output: chains/run_control_planck_only
force: true
resume: false
