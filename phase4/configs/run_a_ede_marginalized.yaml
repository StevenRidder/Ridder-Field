# Paper 2 Run A: Geometric EDE with full marginalization
# Goal: Quantify A_sh significance after marginalizing over cosmology + EDE + nuisances
# k = 8 parameters (6 base + 2 EDE)

theory:
  classy:
    path: /home/azureuser/Ridder-Field/phase2/class/python
    packages_path: /home/azureuser/packages
    extra_args:
      output: tCl, pCl, lCl, mPk
      l_max_scalars: 5000
      lensing: "yes"
      gauge: newtonian
      # Ridder field configuration
      use_ridder: "yes"
      ridder_model_type: v3_canon
      ridder_use_shelf: "yes"
      ridder_use_tail: "no"
      ridder_f_eV: 2.0e26
      theta_i_ridder: 2.8
      beta_ridder: 0.0
      ridder_sigma_lna: 0.656

likelihood:
  # Planck 2018 low-ℓ
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  
  # Planck 2018 high-ℓ
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  
  # ACT DR6 (UPDATE: replace with actual DR6 likelihood when available)
  # For now using DR4 as placeholder
  pyactlike.ACTPol_lite_DR4:
  
  # Pre-DESI BAO
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:
  
  # DESI Y1 BAO
  likelihoods.desi_y1_bao.DESI_Y1_BAO:
    python_path: /home/azureuser/Ridder-Field/phase4
  
  # Pantheon+ Supernovae (no local H0 prior for this run)
  sn.pantheonplus:

params:
  # Base ΛCDM (k=6)
  logA:
    prior: {min: 2.5, max: 3.5}
    ref: 3.044
    proposal: 0.01
    drop: true
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  n_s:
    prior: {min: 0.88, max: 1.02}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  H0:
    prior: {min: 60, max: 80}
    ref: 69.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior: {min: 0.09, max: 0.14}
    ref: 0.12
    proposal: 0.002
    latex: \Omega_c h^2
  tau_reio:
    prior: {min: 0.01, max: 0.12}
    ref: 0.0544
    proposal: 0.006
    latex: \tau_{reio}

  # EDE parameters (k=8)
  ridder_Lambda_EDE_eV:
    prior: {min: 0.1, max: 1.5}
    ref: 0.5
    proposal: 0.05
    latex: \Lambda_{EDE}
  ridder_a_c:
    prior: {min: 0.0001, max: 0.0005}
    ref: 0.00031
    proposal: 2.0e-05
    latex: a_c

  # Derived parameters
  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)"
    latex: S_8
  rs_drag:
    derived: true
    latex: r_s
  # TODO: Add A_sh derived parameter when template computation is implemented
  # A_sh:
  #   derived: "lambda theory: compute_Ash_from_theory(theory)"
  #   latex: A_{sh}

sampler:
  mcmc:
    max_samples: 2000000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.01
    burn_in: 500
    learn_proposal: true
    covmat: auto
    max_tries: 50000

output: chains/paper2/run_a_ede_marginalized
resume: true

