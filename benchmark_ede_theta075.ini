# Phase 3: EDE Benchmark Configuration
# Optimal parameters from Phase 2: Lambda×30, theta_i=0.75
# z_peak ~ 691, f_peak ~ 0.063
# Purpose: H₀-relevant EDE model for observational comparison

# Standard cosmological parameters (Planck 2018 baseline)
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454

# Ridder field with EDE dynamics (from Phase 2 parameter map)
Lambda_EDE_ridder = 0.4964450
f_axion_ridder = 2.435e27
theta_i_ridder = 0.75
beta_ridder = 0.0
n_ridder = 3
ridder_c_slow = 1.0

# FULL DYNAMICS: Klein-Gordon evolution with EDE bump
ridder_freeze_phi = no
ridder_force_damping = 1.0
use_ridder_shooting = 0

# Gauge
gauge = newtonian

# Output: Full perturbations and CMB spectra
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 10.0

# Write files
write background = yes
write thermodynamics = yes
write primordial = yes
k_output_values = 0.01

# Output directory
root = output/benchmark_ede_theta075_

