# Viable point scan: Lambda=20meV, f_axion=0.3
# Targeting f_EDE <= 0.18, BAO <= 3%, CMB acoustic <= 10%

# Standard cosmology
H0 = 67.36
omega_b = 0.02238280
omega_cdm = 0.1201075
A_s = 2.098900e-09
n_s = 0.965952
tau_reio = 0.05430842

# Ridder unified
use_ridder = yes
gauge = newtonian
ridder_model_type = unified

# Tail (late-time DE)
ridder_use_tail = yes
ridder_Lambda_tail_eV = 20e-3
ridder_alpha_tail = 1.0
ridder_n_tail = 1.0

# Shelf (EDE) - controlled by f_axion
ridder_use_shelf = yes
ridder_m_axion = 7e4
ridder_f_axion = 0.3
ridder_n_EDE = 3.0
ridder_theta_EDE_low = 0.1
ridder_theta_EDE_high = 3.0
ridder_sigma_theta_EDE = 0.3

ridder_use_plateau = no

# Field properties
ridder_f = 1.0e26
theta_i_ridder = 1.0
beta_ridder = 0.0
ridder_c_slow = 1.0

# Output
output = tCl, pCl, mPk
write background = yes
l_max_scalars = 2500
root = /Users/steveridder/Git/Ridder-Field/output/viable_scan/scan_L20_f30
