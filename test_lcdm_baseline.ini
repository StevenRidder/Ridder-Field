# Baseline ΛCDM (No Ridder Field)
# For comparison with Ridder freeze mode test

# Standard cosmological parameters (Planck 2018 baseline)
H0 = 67.36
omega_b = 0.02237
omega_cdm = 0.1200
A_s = 2.1e-9
n_s = 0.9649
tau_reio = 0.0544
YHe = 0.2454
gauge = newtonian

# NO Ridder field
Lambda_EDE_ridder = 0.0

# Output settings (match freeze test)
output = tCl,pCl,lCl,mPk
l_max_scalars = 2500
P_k_max_h/Mpc = 1.0
z_pk = 0

write background = yes
write thermodynamics = yes

format = class

